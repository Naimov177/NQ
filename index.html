<style>
:root{
  --bg:#EEF2F4;--soft:#F7F7F8;--surface:#FFFFFF;--ink:#15171C;--muted:#6B7078;--line:#E8E8EC;
  --accent:#087F5B;--accent-soft:#E8F6F0;--accent-ink:#FFFFFF;
  --warn:#B45309;--warn-soft:#FEF3C7;--bad:#DC2626;--bad-soft:#FEE2E2;--ok:#16A34A;--ok-soft:#DCFCE7;--st1:#64748B;--st2:#2563EB;--st3:#D97706;--st4:#16A34A;--st5:#9CA3AF;--pr1:#6B7280;--pr2:#2563EB;--pr3:#D97706;--pr4:#DC2626;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#0D1218;--soft:#0F1113;--surface:#17191C;--ink:#ECEEF0;--muted:#9AA0A8;--line:#2A2D32;
  --accent:#34D399;--accent-soft:#12261D;--accent-ink:#04130C;
  --warn:#FBBF24;--warn-soft:#3A2E0E;--bad:#F87171;--bad-soft:#3A1A1F;--ok:#4ADE80;--ok-soft:#14301F;--st1:#94A3B8;--st2:#7DA6FF;--st3:#FBBF24;--st4:#4ADE80;--st5:#9AA0A8;--pr1:#9AA0A8;--pr2:#7DA6FF;--pr3:#FBBF24;--pr4:#F87171;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html{background:var(--bg)}
body{margin:0;min-height:100%;background:transparent;color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;line-height:1.25}
h1{font-size:28px;letter-spacing:-.01em}
h2{font-size:17px}
h3{font-size:16px}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;overflow:auto;
  background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.brand{padding:0 8px}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand span{display:block;color:var(--muted);font-size:13px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;
  color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--soft)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{min-width:22px;padding:0 7px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;text-align:center;line-height:22px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 8px;color:var(--muted);font-size:13px}

main{padding:32px clamp(16px,4vw,48px) 64px;max-width:1180px;width:100%}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:24px}
.head p{color:var(--muted);margin-top:4px}
.section{margin-top:32px}
.section>h2{margin-bottom:12px;display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.sub{color:var(--muted);font-weight:400;font-size:14px}
.back{display:inline-block;margin-bottom:14px;text-decoration:none;font-weight:500}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.row .grow{flex:1 1 260px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:4px;color:var(--muted);font-size:13px;align-items:center}
.chip{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:500;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.empty{padding:22px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.quiet{border-color:transparent;color:var(--muted)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
input[type=text],input[type=date],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
input[type=text]{flex:1 1 200px}
textarea{width:100%;resize:vertical;line-height:1.45}
select{cursor:pointer;max-width:100%}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.lbl{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}

/* focus slots */
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.slot{min-height:150px;border-radius:14px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.slot.filled{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent)}
.slot.empty{border:2px dashed var(--line);color:var(--muted);justify-content:center}
.slot.done{border-left-color:var(--ok)}
.slot.done .slot-title{text-decoration:line-through;color:var(--muted)}
.slot-title{font-size:19px;font-weight:600;line-height:1.3}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.meter{display:inline-flex;gap:5px;vertical-align:middle}
.meter i{width:11px;height:11px;border-radius:50%;border:2px solid var(--accent);display:block}
.meter i.on{background:var(--accent)}

.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.habit-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.habit-row:last-child{border-bottom:0}
.habit-row input{width:18px;height:18px;accent-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pcard h3 a{color:var(--ink);text-decoration:none}
.pcard h3 a:hover{color:var(--accent)}
.pcard .meta{margin:8px 0 14px}

.h1in{width:100%;flex:none;font-size:28px;font-weight:600;letter-spacing:-.01em;border:1px solid transparent;background:transparent;padding:4px 8px;margin-left:-8px;border-radius:8px}
.h1in:hover,.h1in:focus{border-color:var(--line);background:var(--surface)}
.note-card{display:flex;flex-direction:column;gap:8px}
.note-card .meta{justify-content:space-between;margin:0}

.scroll{overflow-x:auto}
.tsum{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 24px;margin-bottom:12px}
.prog{display:flex;align-items:center;gap:12px;flex:1 1 280px;min-width:0}
.prog span{white-space:nowrap;font-size:14px;color:var(--muted)}
.prog b{color:var(--ink)}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.counts{display:flex;flex-wrap:wrap;gap:6px}
.tag{border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:600}
[data-k="st"][data-v="Новая"]{color:var(--st1);background:color-mix(in srgb,var(--st1) 14%,var(--surface))}
[data-k="st"][data-v="В работе"]{color:var(--st2);background:color-mix(in srgb,var(--st2) 14%,var(--surface))}
[data-k="st"][data-v="На проверке"]{color:var(--st3);background:color-mix(in srgb,var(--st3) 16%,var(--surface))}
[data-k="st"][data-v="Завершена"]{color:var(--st4);background:color-mix(in srgb,var(--st4) 15%,var(--surface))}
[data-k="st"][data-v="Отменена"]{color:var(--st5);background:color-mix(in srgb,var(--st5) 14%,var(--surface))}
[data-k="pr"][data-v="Низкий"]{color:var(--pr1);background:color-mix(in srgb,var(--pr1) 12%,var(--surface))}
[data-k="pr"][data-v="Средний"]{color:var(--pr2);background:color-mix(in srgb,var(--pr2) 12%,var(--surface))}
[data-k="pr"][data-v="Высокий"]{color:var(--pr3);background:color-mix(in srgb,var(--pr3) 14%,var(--surface))}
[data-k="pr"][data-v="Критический"]{color:var(--pr4);background:color-mix(in srgb,var(--pr4) 14%,var(--surface))}
.sel{position:relative;display:inline-flex;align-items:center;border-radius:99px;transition:background .15s,color .15s}
.sel::after{content:"";position:absolute;right:12px;top:50%;width:5px;height:5px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:translateY(-75%) rotate(45deg);pointer-events:none;opacity:.7}
.sel select{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:inherit;font-weight:600;font-size:13px;padding:6px 30px 6px 13px;border-radius:99px;cursor:pointer;width:auto}
.sel select option{color:var(--ink);background:var(--surface)}
.sel[data-k="pr"]::before{content:"";position:absolute;left:12px;top:50%;width:7px;height:7px;border-radius:50%;background:currentColor;transform:translateY(-50%)}
.sel[data-k="pr"] select{padding-left:26px}

.tcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tbl{width:100%;border-collapse:separate;border-spacing:0;min-width:1200px}
.tbl th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:12px 10px;background:color-mix(in srgb,var(--soft) 75%,var(--surface));border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;background:var(--surface);transition:background .12s}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.tbl .c-title{min-width:290px;position:sticky;left:0;z-index:2}
.tbl th.c-title{z-index:3}
.tbl .c-desc{min-width:270px}.tbl .c-who{min-width:180px}.tbl .c-created{min-width:86px}
.tbl .c-due{min-width:150px}.tbl .c-stat{min-width:150px}.tbl .c-prio{min-width:150px}.tbl .c-cmt{min-width:100px}.tbl .c-act{min-width:52px}
.tbl td.c-created{white-space:nowrap;color:var(--muted);font-size:13.5px}
.tcell{display:flex;align-items:center;gap:10px}
.tbl .cell{flex:1 1 auto;width:100%;min-width:0;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;color:var(--ink)}
.tbl .cell:hover{background:var(--soft)}
.tbl .cell:focus{outline:none;background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.tbl .t-title{font-weight:600;font-size:15px}
.tbl .t-desc{font-size:13.5px;color:var(--muted);resize:none;line-height:1.4;min-height:56px;field-sizing:content}
.tbl .due{font-weight:500}
.tbl .due.late{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.tbl tr.done .t-title{text-decoration:line-through;color:var(--muted)}
.tbl tr.done .t-desc{opacity:.7}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none;letter-spacing:.02em}
.rc{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;flex:none;display:grid;place-items:center;padding:0}
.rc:hover{border-color:var(--accent)}
.rc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.rc[aria-pressed="true"]::after{content:"";width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:8px;padding:6px 10px;color:var(--muted);cursor:pointer;font-weight:500}
.cbtn:hover{background:var(--soft);color:var(--accent)}
.cbtn.has{color:var(--ink)}
.ibtn{border:0;background:transparent;border-radius:8px;width:34px;height:34px;display:grid;place-items:center;color:var(--muted);cursor:pointer;opacity:0;transition:opacity .12s}
.tbl tr:hover .ibtn,.ibtn:focus-visible{opacity:1}
.ibtn:hover{background:var(--bad-soft);color:var(--bad)}
@media (hover:none){.ibtn{opacity:1}}
.quick-add{display:flex;flex-wrap:wrap;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.quick-add input,.quick-add select{background:var(--soft);border-color:transparent}
.quick-add input:focus,.quick-add select:focus{background:var(--surface);border-color:var(--accent);outline:none}
.note-card{border-left:4px solid var(--accent)}
.note-card textarea{border:1px solid transparent;background:transparent;padding:6px 8px;border-radius:8px}
.note-card textarea:hover{background:var(--soft)}
.note-card textarea:focus{background:var(--surface);border-color:var(--accent);outline:none}
.hgrid{width:100%;border-collapse:collapse}
.hgrid th,.hgrid td{padding:8px 4px;text-align:center;font-weight:500;font-size:13px}
.hgrid th:first-child,.hgrid td:first-child{text-align:left;font-size:15px;padding-right:12px}
.hgrid th.today{color:var(--accent);font-weight:700}
.dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.dot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}

.dl{display:grid;grid-template-columns:1fr auto;gap:10px 16px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:600;text-align:right}

.chat{display:flex;flex-direction:column;height:min(62vh,560px);padding:0}
.log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft)}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.msg ul{margin:6px 0 0;padding-left:18px}
.msg .btn{margin-top:10px}
.quick{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.chat .form{padding:12px 16px;border-top:1px solid var(--line)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:24px;width:min(560px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin-bottom:8px}
dialog ul{padding-left:18px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw}
.toast.show{opacity:1}

/* ---- v3: стиль основного продукта ---- */
main{max-width:1240px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.card,.tcard,.quick-add,.chat,.empty{border-radius:16px}
.row{border-radius:12px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;font-weight:600}
.btn.primary{box-shadow:0 1px 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.brand b{display:flex;align-items:center;gap:10px;font-weight:800}
.brand b::before{content:"";width:26px;height:26px;border-radius:8px;background:var(--accent)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13px}
.tbl th{text-transform:uppercase;letter-spacing:.05em;font-size:11.5px;font-weight:700}

.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:9px 16px;background:var(--soft);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer}
.tab:hover{background:var(--accent-soft)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.cnt{font-size:11.5px;font-weight:700;padding:0 7px;border-radius:99px;background:color-mix(in srgb,currentColor 16%,transparent)}

.dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.main-card{padding:20px}
.hero{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;margin-top:10px}
.big{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.big small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:8px}
.hero .right{text-align:right}
.bigacc{font-size:30px;font-weight:800;color:var(--accent);letter-spacing:-.02em;line-height:1.1}
.bar.thick{height:10px;margin-top:14px;flex:none}
.barcap{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted);margin-top:8px}
.banner{margin-top:16px;padding:13px 16px;border-radius:12px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line))}
.banner b{color:var(--accent)}
.blk{margin:26px 0 10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .num{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
.stat .num.ok{color:var(--ok)}.stat .num.bad{color:var(--bad)}
.slot.filled{background:var(--soft);border:1px solid var(--line)}
.slot.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.slot.empty{border-radius:14px}

.side-card{padding:20px}
.sidehead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sidehead h3{font-size:17px;font-weight:700}
.newpill{background:var(--bad);color:var(--surface);font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.notifs{margin-top:6px}

/* ---- v5: сроки, неделя, долгие задачи ---- */
.twocol{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:24px}

.trow{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}

.weekwrap{overflow-x:auto;padding-bottom:4px}

.latebar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;background:var(--bad-soft);border-radius:12px;padding:8px 14px;margin-bottom:12px}

.gbar{position:relative;height:10px;border-radius:99px;background:var(--line)}
.gbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#22D3EE))}

.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;align-items:start}

.tbl .tcell span{white-space:nowrap}
.tbl .tag{white-space:nowrap;display:inline-block}

/* ---- v11: таблетки-фильтры ---- */
.counts .tag{border:0;cursor:pointer;font:inherit;font-size:11.5px;font-weight:600;transition:box-shadow .12s,transform .12s}
.counts .tag:hover{transform:translateY(-1px);filter:brightness(.96)}
.counts .tag[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px currentColor}
.tag[data-v="Все"]{color:var(--ink);background:var(--soft)}
/* ---- v12: шапка проекта, фильтр проектов ---- */
.phead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.phead .h1in{flex:1;margin-left:0}
.iback{display:inline-grid;place-items:center;width:36px;height:36px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;transition:border-color .15s,color .15s,background .15s}

.pfilter{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;margin-bottom:6px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;background:var(--soft);border:1px solid var(--line);border-radius:12px}
.seg-btn{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:9px;cursor:pointer;transition:background .15s,color .15s}
.seg-btn svg{width:15px;height:15px;flex:none}
.seg-btn:hover{color:var(--ink)}
.seg-btn[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(16,24,40,.12),0 0 0 1px var(--line)}
.pf-right{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.search{position:relative;display:inline-flex;align-items:center}
.search .sicon{position:absolute;left:10px;color:var(--muted);display:grid;pointer-events:none}
.search .sicon svg{width:15px;height:15px}
.search input{width:220px;padding:6px 10px 6px 32px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px}
.search input:focus,#psort:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
#psort{border-radius:10px}
.pinfo{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:0 0 10px;min-height:28px}
mark{background:color-mix(in srgb,var(--warn) 32%,transparent);color:inherit;border-radius:3px;padding:0 1px}
/* ---- v13: страница задачи, «Все задачи», название проекта ---- */
.phead .h1in{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.2;border:1px solid transparent;background:transparent;padding:2px 8px;margin-left:-8px;flex:1;min-width:0}

.acts{display:flex;gap:2px;justify-content:flex-end}
.tbl .c-proj{min-width:130px}
.tbl .c-proj .chip{display:inline-block;text-decoration:none;white-space:nowrap}
.tbl .tmoved{padding-left:6px}
.tfilter,.pfilter{margin-bottom:6px}

.tpage.tp{background:none;border:0;border-radius:0;overflow:visible}
.tp-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.tp-head .iback{margin-top:4px}
.tp-tw{flex:1;min-width:0}
.tp-head .tp-title{display:block;width:100%;flex:none;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.2;border:1px solid transparent;background:transparent;padding:2px 8px;margin-left:-8px;border-radius:8px}
.tp-head .tp-title:hover,.tp-head .tp-title:focus{border-color:var(--line);background:var(--surface);outline:none}
.tp-sub{margin-top:2px}
.tp-sub .chip{text-decoration:none}
.tp-props{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 16px;align-items:end;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.tp-pl{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.tp-prop input{width:100%;flex:none}
.tp-prop input.late{border-color:var(--bad);color:var(--bad)}
.tp-pv{display:block;padding:6px 0;font-weight:600}
.tp-act{display:flex;align-items:flex-end;justify-content:flex-end}
.tp-cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:stretch}
.tp-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.tp-col>.tpan:last-child{flex:1}
.tpan{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}

.tpan.k-note .tpan-ico{background:var(--warn);color:var(--surface)}
.tpan.k-file .tpan-h{background:color-mix(in srgb,var(--accent) 9%,var(--surface));border-bottom-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.tpan.k-file .tpan-ico{background:var(--accent);color:var(--accent-ink)}
.tpan.k-link .tpan-h{background:color-mix(in srgb,var(--st2) 9%,var(--surface));border-bottom-color:color-mix(in srgb,var(--st2) 30%,var(--line))}
.tpan.k-link .tpan-ico{background:var(--st2);color:var(--surface)}
.tpan .tdtext{width:100%;min-height:86px;line-height:1.5}
.tpan .tpan-h .btn{padding:2px 9px}
.tpage .cmt{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}

.tpage .cmt{grid-template-columns:64px minmax(0,1fr) auto;align-items:start}
.tpage .cmt .ibtn{margin:-3px 0 -3px 4px}
/* v13b: ровная строка параметров */
.tp-props{grid-template-columns:repeat(5,minmax(0,1fr)) auto;align-items:start}

/* ---- v14: ежедневные задачи ---- */
.htime{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px;color:var(--muted)}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.rtbl{min-width:0;width:100%}

.rtbl .dot{width:22px;height:22px;border-radius:7px}
.tinp{border:1px solid transparent;background:transparent;border-radius:8px;padding:3px 6px;font:inherit;font-size:13px;font-weight:700;width:92px;font-variant-numeric:tabular-nums;color:var(--ink)}

.timefld input{flex:none;width:auto;padding:5px 8px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:8px}

.rside{padding:14px}

.rsteps{display:flex;flex-direction:column;gap:5px}

.rstep.next .rmark{color:var(--accent)}

@media (max-width:1000px){.rgrid{grid-template-columns:minmax(0,1fr)}}

.tbtn:hover{text-decoration:underline dotted;text-underline-offset:3px}

/* ---- v15: удаление ---- */
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:var(--surface)}

/* ---- v16: идея ---- */
.row[data-oi]{cursor:pointer}

.isnip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80ch;margin-top:2px}
.ipage{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 8px;transition:border-color .15s,box-shadow .15s}

.ibody{display:block;width:100%;min-height:40vh;border:0;background:transparent;padding:12px 14px;font:inherit;font-size:15px;line-height:1.7;resize:none;overflow:hidden;color:var(--ink);field-sizing:content}
.ibody:focus{outline:none}
/* ---- v17: «Все задачи» внутри «Проектов» ---- */
.seg-btn.sep{margin-left:8px;position:relative}
.seg-btn.sep::before{content:"";position:absolute;left:-5px;top:7px;bottom:7px;width:1px;background:var(--line)}
.alltbl .c-due{min-width:175px;white-space:nowrap}
.dlab{margin-left:8px;white-space:nowrap}
.tcell.tw{flex-wrap:wrap;gap:2px 8px}
.tcell.tw .tlink{width:auto}
.tbl .tmv{flex:none;font-size:11px}
.pf-right .btn.quiet{flex:none}
/* ---- v18: сохранение идеи ---- */
.isave{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;justify-content:flex-end;gap:12px;width:fit-content;margin:12px 0 0 auto;padding:8px 8px 8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 18px -10px rgba(16,24,40,.35)}
.istat{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.istat::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.istat.dirty{color:var(--warn);font-weight:600}
.istat.dirty::before{background:var(--warn)}
.btn[disabled]{cursor:default}
.btn.primary[disabled]{background:var(--soft);color:var(--muted);border-color:var(--line);box-shadow:none;filter:none}
.btn.primary[disabled] svg{color:var(--ok)}
/* ---- v19: входящие ---- */
.icard{padding:0}
.irow{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);transition:background .12s}
.irow:last-child{border-bottom:0}
.irow:hover{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.itext{flex:1;min-width:0;font-weight:600}
.itime{flex:none;width:104px;text-align:right;color:var(--muted);font-size:12.5px;white-space:nowrap}
.iact{display:flex;align-items:center;gap:6px;flex:none}
.btn.sug{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.pick{display:flex;flex-direction:column;gap:4px;max-height:min(320px,48vh);overflow:auto;padding:2px}
.pk-g{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 2px 0}
.pk{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface);transition:border-color .12s,background .12s}
.pk:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.pk input{accent-color:var(--accent);width:16px;height:16px;flex:none;margin:0}

.pk.none{border-style:dashed}
.pk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pk:has(input:checked) .pk-t{color:var(--accent)}
.dlg-err{color:var(--bad);font-size:12.5px;font-weight:600;margin-top:6px;min-height:0}
.toast.has-act{pointer-events:auto}
.toast-act{margin-left:14px;background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
@media (max-width:700px){.irow{flex-wrap:wrap;row-gap:6px}.itext{flex-basis:100%}.itime{order:3;width:auto;text-align:left;flex:1}.iact{order:4}}
/* ---- v20: комментарии к идеям ---- */
.icm{display:inline-flex;align-items:center;gap:4px;margin-left:10px;color:var(--muted);font-size:12.5px;font-weight:500;vertical-align:1px}
.icm svg{width:13px;height:13px}
/* ---- v21: раздел «План» (неделя + день) ---- */
.dhead{align-items:center}
.dleft{display:flex;align-items:center;gap:12px;min-width:0}
.dleft h1{margin:0}
.dsub{margin-top:2px;color:var(--muted);font-size:13px;text-transform:none}
.dnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button.iback{padding:0;cursor:pointer;font:inherit}
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:14px}
.wchip{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px 7px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none;transition:border-color .15s,background .15s}
.wchip .wd{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.wchip b{font-size:18px;line-height:1.1}
.wchip:hover{border-color:var(--accent)}
.wchip.tdy .wd,.wchip.tdy b{color:var(--accent)}
.wchip.on{background:var(--ink);border-color:var(--ink)}
.wchip.on .wd,.wchip.on b{color:var(--surface)}
.wchip .wn{position:absolute;top:5px;right:6px;font-style:normal;font-size:10.5px;font-weight:700;min-width:16px;height:16px;line-height:16px;border-radius:8px;text-align:center;background:var(--accent-soft);color:var(--accent);padding:0 3px}

.daycol{cursor:pointer;min-height:min(300px,40vh)}
.daycol .wt,.daycol .wlist{cursor:default}
a.dayhead{text-decoration:none;color:inherit;gap:6px;transition:background .15s}

.who-opt{flex:1;display:flex;align-items:center;gap:9px;padding:7px 8px;border:0;border-radius:9px;background:transparent;color:var(--ink);font:inherit;font-size:14px;cursor:pointer;text-align:left;min-width:0}
.who-opt:hover{background:var(--soft)}
.who-opt.on{background:var(--accent-soft)}
.who-box{width:18px;height:18px;flex:none;border:1.6px solid var(--line);border-radius:6px;display:grid;place-items:center;color:var(--accent-ink);background:var(--surface)}
.who-opt.on .who-box{background:var(--accent);border-color:var(--accent)}
.who-box svg{width:12px;height:12px}
.who-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-del{opacity:.55;flex:none}.who-row:hover .who-del{opacity:1}
.who-pad{width:30px;flex:none}
.psec.cmts{border-top:4px solid #6366F1}
.psec.cmts .psec-head{padding:8px 14px;background:color-mix(in srgb,#6366F1 9%,var(--surface));border-bottom-color:color-mix(in srgb,#6366F1 35%,var(--line))}
.psec.cmts .psec-ico{width:26px;height:26px;border-radius:8px;background:#6366F1;color:#fff}
.psec.cmts .psec-ico svg{width:15px;height:15px}
.psec.cmts .psec-head h2{font-size:14.5px}
.psec.cmts .psec-body{padding:10px 14px 14px}
.tp-prop .who{min-width:200px;max-width:340px}
.who-add{display:flex;gap:6px;padding:8px 4px 2px;border-top:1px solid var(--line);margin-top:6px}
.who-add input{flex:1;min-width:0}
.chat-ta{flex:1 1 220px;min-width:0;max-height:42vh;overflow-y:auto;resize:none;line-height:1.45}
.msg.me{white-space:pre-wrap;overflow-wrap:anywhere}
.cmt>span:nth-child(2){white-space:pre-wrap;overflow-wrap:anywhere}
.cmt-comp{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.cmt-comp textarea{width:100%;min-height:54px;max-height:40vh;resize:none;line-height:1.45}
.cmt-btns{display:flex;gap:8px;flex-wrap:wrap}
.cmt-btns .btn svg{width:15px;height:15px;margin-right:6px;vertical-align:-3px}
.cmt-get{margin:8px 0 2px}
.cmt-get .btn svg{width:15px;height:15px;margin-right:6px;vertical-align:-3px}
.cmt.ai{display:flex;gap:10px;align-items:flex-start;margin:8px 0;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--accent) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 24%,var(--line))}
.aiav{width:28px;height:28px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.aiav svg{width:16px;height:16px}
.aib{flex:1;min-width:0}
.aih{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.aiacts{margin-left:auto;display:flex;align-items:center;gap:4px}
.aitx p{margin:6px 0 0}.aitx ul{margin:6px 0 0;padding-left:18px}.aitx li{margin:3px 0}
.dots::after{content:'…';display:inline-block;animation:dots 1.1s steps(4,end) infinite;width:1.2em;overflow:hidden;vertical-align:bottom}
@keyframes dots{0%{width:0}100%{width:1.2em}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}}
/* ---- v33: вход и сохранение в облаке ---- */
#authgate{position:fixed;left:0;top:0;right:0;bottom:0;z-index:99990;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#EDF2F4,#D9E3E8);color:#1E293B;overflow:auto}
:root[data-theme="dark"] #authgate{background:linear-gradient(160deg,#0D1218,#141C26);color:#E6EEFF}
.agcard{width:min(420px,100%);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:28px 26px;box-shadow:0 30px 60px -34px rgba(30,60,90,.5)}
.ag-brand{display:flex;align-items:baseline;gap:4px;margin-bottom:18px}
.ag-brand b{font-size:34px;font-weight:800;letter-spacing:-.02em}
.ag-brand i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block}
.ag-brand span{margin-left:8px;color:var(--muted);font-size:13px}
.agcard h1{font-size:22px;margin:0 0 6px}
.ag-sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.agcard form{display:flex;flex-direction:column;gap:8px}
.agcard label{font-size:13px;font-weight:600}
.agcard input{width:100%;font-size:16px;padding:11px 12px}
.agcard .btn{margin-top:6px;width:100%;justify-content:center}
.ag-err{color:#B3261E;font-size:13px;min-height:1.2em;margin:10px 0 0}
.ag-links{display:flex;gap:14px;justify-content:space-between;align-items:center;margin-top:14px}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:4px 0;text-decoration:underline}
.ag-foot{color:var(--muted);font-size:12px;margin:16px 0 0}
.ag-load{display:flex;align-items:center;gap:10px;color:var(--muted)}
.syncst{font-size:12px;color:var(--muted);padding:2px 10px 6px;display:flex;align-items:center;gap:7px}
.syncst[hidden]{display:none}
.syncst::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.syncst[data-s="saving"]::before,.syncst[data-s="pending"]::before{background:#D49A00}
.syncst[data-s="offline"]::before,.syncst[data-s="error"]::before{background:#B3261E}
@media (max-width:1000px){.dash{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.big{font-size:38px}.hero .right{text-align:left}.main-card,.side-card{padding:16px}}
@media (max-width:1000px){.twocol,.twocols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.tlabel{display:none}.themerow{gap:0}}
@media (max-width:820px){.tdgrid{grid-template-columns:minmax(0,1fr)}.tdside{border-left:0;border-top:2px solid var(--line)}.tdmain,.tdh{padding-left:16px;padding-right:16px}}
@media (max-width:820px){.tpage .tdgrid{grid-template-columns:minmax(0,1fr)}.tpage .tdmain,.tpage .tdh{padding-left:14px;padding-right:14px}}
@media (max-width:900px){.tp-cols{grid-template-columns:minmax(0,1fr)}.tp-head .tp-title{font-size:22px}}
.lbl-s{display:none}
@media (max-width:640px){.pfilter .seg{display:flex;flex-wrap:nowrap;width:100%}.seg-btn{white-space:nowrap;flex:1;justify-content:center;padding:6px 8px;gap:5px}.seg-btn svg{display:none}.lbl-l{display:none}.lbl-s{display:inline}.seg-btn.sep{margin-left:6px}.seg-btn.sep::before{left:-4px}}
</style>

<body>
<div class="app">
  <aside class="side">
    <div class="brand"><svg class="logo" viewBox="0 0 72 34" role="img" aria-label="NQ"><title>NQ</title><path class="s" d="M4 28V6L20 28V6"/><circle class="s" cx="41" cy="17" r="11"/><path class="s" d="M48.5 24.5L54 30.5"/><circle class="d" cx="64" cy="26" r="3.8"/></svg><span class="tagline">Next Quest</span></div>
    <button class="btn primary qcbtn" data-act="qc-open" type="button" title="Быстрая запись (N)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Быстрая запись</button>
    <nav class="nav" id="nav" aria-label="Разделы"></nav>

      <div class="themerow"><span class="tlabel">Тёмная тема</span>
        <button class="tswitch" id="theme" type="button" role="switch" aria-checked="false" aria-label="Тёмная тема">
          <span class="knob" aria-hidden="true">
            <svg class="i-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="i-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </span>
        </button></div>
      <a class="setlink" id="setlink" href="#settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Настройки</span></a>
    </div>
  </aside>
  <main id="view"></main>
</div>
<dialog id="dlg"></dialog>
<button class="fab" data-act="qc-open" type="button" aria-label="Быстрая запись" title="Быстрая запись (N)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ссылка из письма приносит ключи входа в адресе (#access_token=…): забираем их до того, как их увидит маршрутизатор, и сразу убираем из адреса */
const NQ_AUTH_HASH=(()=>{const h=String(location.hash||'');if(/^#(.*&)?(access_token|error|error_code|error_description)=/.test(h)){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}return h.slice(1);}return '';})();
const CLOUD=!!(window.supabase&&window.NQ_CONFIG&&NQ_CONFIG.url&&NQ_CONFIG.key);
const uuid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);});
let uid=100;const nid=()=>CLOUD?uuid():'x'+(uid++);
const pl=(n,f)=>{const m=n%100,k=n%10;return f[(m>10&&m<20)?2:k===1?0:(k>=2&&k<=4)?1:2];};

const STATUSES=['Новая','В работе','На проверке','Завершена','Отменена'];
const PRIOS=['Низкий','Средний','Высокий','Критический'];
const ISTAT=['В копилке','Беру в работу','Отброшена'];
const CLOSED=['Завершена','Отменена'];

/* dates */
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const TODAY=()=>ymd(new Date());
const off=n=>{if(n===null)return '';const d=new Date();d.setDate(d.getDate()+n);return ymd(d);};
const diff=s=>s?Math.round((new Date(s+'T00:00:00')-new Date(TODAY()+'T00:00:00'))/864e5):null;
const fdate=s=>s?new Date(s+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'}):'без срока';
const dayWord=n=>pl(n,['день','дня','дней']);
const dueLabel=s=>{const d=diff(s);return d===null?'без срока':d===0?'сегодня':d===1?'завтра':d<0?`просрочено на ${-d} ${dayWord(-d)}`:`через ${d} ${dayWord(d)}`;};

const mk=o=>Object.assign({id:nid(),title:'',desc:'',assignees:['Я'],created:TODAY(),due:'',status:'Новая',prio:'Средний',comments:[],notes:[],files:[],links:[],project:null,focus:false,repeat:'',start:'',endOn:'',doneOn:''},o);

const S={
  f:{project:'',status:''},
  team:['Я'],
  projects:[],tasks:[],inbox:[],ideas:[],habits:[],
  chat:[{who:'bot',html:'Привет! Я помогу разобрать входящие, выбрать задачи на день и ничего не забыть. Нажми одну из быстрых команд ниже.'}]
};

const proj=id=>S.projects.find(x=>x.id===id);
const pname=id=>{const p=proj(id);return p?p.name:'Без проекта';};
const open=()=>S.tasks.filter(t=>!CLOSED.includes(t.status));
const isDone=t=>t.status==='Завершена';
const dueChip=t=>{if(t.repeat==='daily')return '<span class="chip rep">каждый день</span>';const d=diff(t.due);const c=d!==null&&d<0&&!CLOSED.includes(t.status)?'bad':d===0?'warn':'';return `<span class="chip ${c}">${dueLabel(t.due)}</span>`;};
const prioChip=t=>`<span class="chip ${t.prio==='Критический'?'bad':t.prio==='Высокий'?'warn':''}">${t.prio}</span>`;
const opts=(arr,sel)=>arr.map(v=>`<option${v===sel?' selected':''}>${esc(v)}</option>`).join('');
const projOpts=sel=>`<option value=""${!sel?' selected':''}>Без проекта</option>`+S.projects.map(p=>`<option value="${p.id}"${p.id===sel?' selected':''}>${esc(p.name)}</option>`).join('');

/* ---------- ответственные: общий список людей и выбор нескольких ---------- */
const WHO={sel:{new:['Я']},open:'',focusIn:false};
const whoNames=x=>(x&&Array.isArray(x.assignees)?x.assignees:[]).filter(Boolean);
const whoText=x=>{const n=whoNames(x);return n.length?n.join(', '):'не назначен';};
const whoAvs=names=>`<span class="avs">${names.slice(0,3).map(n=>avatar(n)).join('')}${names.length>3?`<span class="av more">+${names.length-3}</span>`:''}</span>`;
const whoCell=x=>{const n=whoNames(x);return n.length?`${whoAvs(n)}<span class="who-names">${esc(n.join(', '))}</span>`:'<span class="muted">Не назначен</span>';};
function whoGet(key){if(key.startsWith('task:')){const t=S.tasks.find(x=>x.id===key.slice(5));if(!t)return [];if(!Array.isArray(t.assignees))t.assignees=[];return t.assignees;}return WHO.sel[key]||(WHO.sel[key]=['Я']);}
function whoHtml(key){
  const sel=whoGet(key),open=WHO.open===key;
  return `<div class="who${open?' open':''}" data-key="${esc(key)}"><button type="button" class="who-btn" data-act="who-toggle" data-key="${esc(key)}" aria-haspopup="listbox" aria-expanded="${open}" aria-label="Ответственные: ${esc(sel.length?sel.join(', '):'не назначен')}">${sel.length?`${whoAvs(sel)}<span class="who-names">${esc(sel.join(', '))}</span>`:'<span class="muted">Не назначен</span>'}<svg class="who-chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>`+
  (open?`<div class="who-pop" role="listbox" aria-multiselectable="true" aria-label="Выбор ответственных"><div class="who-list">${S.team.map(n=>{const on=sel.includes(n);return `<div class="who-row"><button type="button" class="who-opt${on?' on':''}" role="option" aria-selected="${on}" data-act="who-pick" data-key="${esc(key)}" data-name="${esc(n)}"><span class="who-box">${on?ICON_CHECK:''}</span>${avatar(n)}<span class="who-nm">${esc(n)}</span></button>${n==='Я'?'<span class="who-pad" aria-hidden="true"></span>':`<button type="button" class="ibtn sm who-del" data-act="who-del" data-key="${esc(key)}" data-name="${esc(n)}" aria-label="Убрать ${esc(n)} из списка людей">${ICON_X}</button>`}</div>`;}).join('')}</div><div class="who-add"><input type="text" id="who-in" data-noai data-enter="who-add-btn" data-key="${esc(key)}" placeholder="Новый человек…" aria-label="Имя нового человека" autocomplete="off" maxlength="40"><button type="button" class="btn small" id="who-add-btn" data-act="who-add" data-key="${esc(key)}">Добавить</button></div></div>`:'')+`</div>`;
}
function whoRefreshAll(){
  document.querySelectorAll('.who').forEach(w=>{const tmp=document.createElement('div');tmp.innerHTML=whoHtml(w.dataset.key);w.replaceWith(tmp.firstElementChild);});
  if(WHO.open&&WHO.focusIn){const i=document.getElementById('who-in');if(i)i.focus();WHO.focusIn=false;}
}
document.addEventListener('click',e=>{if(WHO.open&&!e.target.closest('.who')){WHO.open='';whoRefreshAll();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&WHO.open){e.preventDefault();e.stopPropagation();WHO.open='';whoRefreshAll();}},true);
function whoAct(act,b){
  const key=b.dataset.key,name=b.dataset.name;
  if(act==='who-toggle'){WHO.open=WHO.open===key?'':key;WHO.focusIn=WHO.open===key;whoRefreshAll();return;}
  if(act==='who-pick'){const a=whoGet(key),i=a.indexOf(name);if(i>=0)a.splice(i,1);else a.push(name);whoRefreshAll();return;}
  if(act==='who-add'){const inp=document.getElementById('who-in'),v=(inp?inp.value:'').trim().replace(/\s+/g,' ');if(!v){if(inp)inp.focus();return;}
    const ex=S.team.find(n=>n.toLowerCase()===v.toLowerCase()),nm=ex||v;if(!ex)S.team.push(nm);const a=whoGet(key);if(!a.includes(nm))a.push(nm);
    WHO.focusIn=true;whoRefreshAll();return;}
  if(act==='who-del'){if(name==='Я'||!S.team.includes(name))return;const idx=S.team.indexOf(name),aff=S.tasks.filter(x=>whoNames(x).includes(name)).map(x=>x.id),inNew=(WHO.sel.new||[]).includes(name);
    S.team.splice(idx,1);S.tasks.forEach(x=>{if(Array.isArray(x.assignees))x.assignees=x.assignees.filter(n=>n!==name);});if(WHO.sel.new)WHO.sel.new=WHO.sel.new.filter(n=>n!==name);
    toast(`Убран из списка людей: ${name}.`,{label:'Вернуть',fn:()=>{if(!S.team.includes(name))S.team.splice(Math.min(idx,S.team.length),0,name);aff.forEach(id=>{const x=S.tasks.find(q=>q.id===id);if(x&&!whoNames(x).includes(name)){x.assignees=(x.assignees||[]).concat(name);}});if(inNew&&WHO.sel.new&&!WHO.sel.new.includes(name))WHO.sel.new.push(name);render();}});
    render();return;}
}

/* ---------- views ---------- */
const lvl=(c,txt)=>`<span class="lvl ${c}">${txt}</span>`;
const ICON_CHECK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const DOW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const mondayOf=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return d;};
const streakOf=h=>{let i=h.days[6]?6:5,n=0;while(i>=0&&h.days[i]){n++;i--;}return n;};
/* the rule: a task shows up in «Сегодня» when its deadline arrives (or has passed) */
function todayData(){
  const td=TODAY();
  const list=S.tasks.filter(x=>x.repeat==='daily'?occurs(x,td):(x.due&&((!CLOSED.includes(x.status)&&x.due<=td)||(isDone(x)&&x.due===td))));
  return list.sort((a,b)=>(CLOSED.includes(a.status)-CLOSED.includes(b.status))||((a.due||'9999').localeCompare(b.due||'9999'))||PRIOS.indexOf(b.prio)-PRIOS.indexOf(a.prio));
}
const movedChip=x=>x.moves?`<span class="chip warn">перенесена ${x.moves} ${pl(x.moves,['раз','раза','раз'])}</span>`:'';
const trow=(x,s)=>{s=typeof s==='string'?s:TODAY();const rp=x.repeat==='daily',done=doneAt(x,s),late=!rp&&!!x.due&&x.due<TODAY()&&!done,tdy=!rp&&x.due===TODAY();
  const last=x.moves&&x.comments.length?x.comments[x.comments.length-1].text:'';
  const chip=rp?`<span class="chip rep">${ICON_REPEAT}каждый день</span>`:late?`<span class="chip bad">${dueLabel(x.due)}</span>`:tdy?'<span class="chip warn">срок сегодня</span>':'';
  const dis=rp&&s!==TODAY();
  return `<div class="trow ${done?'done':''}" data-open="${x.id}"><input type="checkbox" data-act="toggle-done" data-id="${x.id}" ${done?'checked':''}${dis?' disabled':''} aria-label="Отметить выполненной: ${esc(x.title)}">

const parseYmd=s=>new Date(s+'T00:00:00');

const wkLabel=m=>{const a=parseYmd(m),b=parseYmd(addDays(m,6));

const ICON_CHEV_L='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>';

/* a task that is set to «remind every day» appears on every day from its start until it is completed or cancelled */
const occurs=(x,s)=>x.repeat==='daily'&&!!x.start&&x.start<=s&&(!x.endOn||s<=x.endOn);
const tasksOn=s=>S.tasks.filter(x=>x.repeat==='daily'?occurs(x,s):(x.due===s&&x.status!=='Отменена'));
const doneAt=(x,s)=>x.repeat==='daily'?(x.status==='Завершена'&&s===x.endOn):isDone(x);
function setStatus(x,v){const was=x.status;x.status=v;
  if(v==='Завершена'&&was!=='Завершена')fxDone();else if(was==='Завершена'&&v!=='Завершена')sfx('soft');
  if(v==='Завершена')x.doneOn=TODAY();else if(was==='Завершена')x.doneOn='';
  if(x.repeat==='daily'){if(v==='Завершена')x.endOn=TODAY();else if(v==='Отменена')x.endOn=addDays(TODAY(),-1);else if(CLOSED.includes(was))x.endOn='';}}
const dailyLink=(txt)=>`<a class="eyebrow elink" href="#routine" title="Открыть раздел «Ежедневные задачи»">${txt}${ICON_CHEV_R}</a>`;
function dayList(s){return s===TODAY()?todayData():tasksOn(s).sort((a,b)=>doneAt(a,s)-doneAt(b,s)||PRIOS.indexOf(b.prio)-PRIOS.indexOf(a.prio));}
function weekStrip(s){const m=mondayOfY(s),td=TODAY();
  return `<nav class="wstrip" aria-label="Дни недели">${[...Array(7)].map((_,i)=>{const y=addDays(m,i),l=dayList(y),open=l.filter(x=>!doneAt(x,y)).length;
    return `<a class="wchip${y===s?' on':''}${y===td?' tdy':''}" href="#${dayHash(y)}"${y===s?' aria-current="page"':''} aria-label="${DOW[i]}, ${parseYmd(y).getDate()}${y===td?', сегодня':''}"><span class="wd">${DOW[i]}</span><b>${parseYmd(y).getDate()}</b>${l.length?`<i class="wn">${open||'✓'}</i>`:''}</a>`;}).join('')}</nav>`;}
function dayHead(s){
  const isT=s===TODAY(),dt=parseYmd(s);

  const sub=isT?dt.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}):`${dt.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}, ${relDay(s)}`;
  return `<div class="head dhead"><div class="dleft"><a class="iback" href="#plan" aria-label="Назад к неделе" title="Вся неделя">${ICON_BACK}</a><div><h1>${esc(title)}</h1><p class="dsub">${esc(sub)}</p></div></div>
    <div class="dnav"><a class="iback" href="#${dayHash(addDays(s,-1))}" aria-label="Предыдущий день" title="Предыдущий день (←)">${ICON_CHEV_L}</a><a class="iback" href="#${dayHash(addDays(s,1))}" aria-label="Следующий день" title="Следующий день (→)">${ICON_CHEV_R}</a>${isT?`<button class="btn primary" data-act="close-day" type="button">${ICON_CHECK}Подвести итог дня</button>`:'<a class="btn" href="#today">Сегодня</a>'}</div></div>

function vDay(s){return s===TODAY()?vToday():vDayOther(s);}
function vDayOther(s){
  const list=dayList(s),doneN=list.filter(x=>doneAt(x,s)).length,tot=list.length,pct=tot?Math.round(doneN/tot*100):0;

function vToday(){

const PCATS=[['','Все проекты','<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'],
  ['alif','Проекты Алифтека','<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>'],

const pMatch=(p,q)=>!q||p.name.toLowerCase().includes(q.toLowerCase());
const hl=(name,q)=>{if(!q)return esc(name);const i=name.toLowerCase().indexOf(q.toLowerCase());if(i<0)return esc(name);
  return esc(name.slice(0,i))+'<mark>'+esc(name.slice(i,i+q.length))+'</mark>'+esc(name.slice(i+q.length));};
function pStats(p){const all=S.tasks.filter(x=>x.project===p.id);return {all:all.length,open:all.filter(x=>!CLOSED.includes(x.status)).length,done:all.filter(isDone).length};}
function pList(){
  const q=S.pq.trim();
  const list=S.projects.filter(p=>(!S.pf||p.block===S.pf)&&pMatch(p,q));
  const pct=p=>{const s=pStats(p);return s.all?s.done/s.all:0;};
  if(S.psort==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  else if(S.psort==='open')list.sort((a,b)=>pStats(b).open-pStats(a).open);
  else if(S.psort==='progress')list.sort((a,b)=>pct(a)-pct(b));
  return list;
}
const PSHORT={'':'Все',alif:'Алифтек',personal:'Личные',tasks:'Задачи'};
function psegHtml(){
  return PCATS.map(([k,l,ic])=>{const n=k==='tasks'?S.tasks.length:S.projects.filter(p=>!k||p.block===k).length;
    return `<button type="button" class="seg-btn${k==='tasks'?' sep':''}" data-act="p-tab" data-s="${k}" aria-pressed="${S.pf===k}">${svgI(ic)}<span class="lbl-l">${l}</span><span class="lbl-s">${PSHORT[k]}</span><span class="cnt">${n}</span></button>`;}).join('');}
function pgridHtml(){
  const q=S.pq.trim(),list=pList();
  return list.length?`<div class="grid">${list.map(p=>{const s=pStats(p),pct=s.all?Math.round(s.done/s.all*100):0;
    return `<a class="card pcard" href="#project-${p.id}"><div class="pc-top"><h3>${hl(p.name,q)}</h3><span class="chip ${p.block==='alif'?'ok':''}">${BLABEL[p.block]}</span></div>
    <div class="meta"><span>${s.open} ${pl(s.open,['открытая задача','открытые задачи','открытых задач'])}</span><span>${p.notes.length} ${pl(p.notes.length,['заметка','заметки','заметок'])}</span></div>
    <div class="pbar" role="progressbar" aria-label="Завершено задач" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <div class="gmeta"><span>${s.done} из ${s.all} ${pl(s.all,['задачи','задач','задач'])} завершено</span><span>${pct}%</span></div></a>`;}).join('')}</div>`
  :(!S.projects.length?`<div class="empty">Проектов пока нет. Создайте первый кнопкой «+ Создать проект».</div>`:`<div class="empty">Ничего не найдено. <button class="btn small" data-act="p-reset" type="button">Сбросить фильтры</button></div>`);
}
function pinfoHtml(){return `<span>Показано ${pList().length} из ${S.projects.length}</span>${(S.pf||S.pq.trim())?'<button class="btn small quiet" data-act="p-reset" type="button">Сбросить фильтры</button>':''}`;}

const initials=n=>{const w=String(n||'').trim().split(/\s+/).filter(Boolean);return w.length?(w[0][0]+(w[1]?w[1][0]:'')).toUpperCase():'?';};

const selW=(k,id,change,arr,val,label)=>`<span class="sel" data-k="${k}" data-v="${esc(val)}"><select data-change="${change}" data-id="${id}" aria-label="${label}">${opts(arr,val)}</select></span>`;
const ICON_CHAT='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>';
const ICON_TRASH='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></svg>';
const ICON_CAL='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
const ICON_BACK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>';
const sumHtml=id=>{const ts=S.tasks.filter(t=>t.project===id);const done=ts.filter(isDone).length;const pct=ts.length?Math.round(done/ts.length*100):0;
  return `<div class="prog"><span><b>${done}</b> из ${ts.length} ${pl(ts.length,['задачи','задач','задач'])} завершено</span><div class="bar" role="progressbar" aria-label="Прогресс проекта" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div>
  <div class="counts" role="group" aria-label="Фильтр задач по статусу">${['',...STATUSES].map(s=>`<button type="button" class="tag" data-k="st" data-v="${s||'Все'}" data-act="t-filter" data-id="${id}" data-s="${s}" aria-pressed="${(S.tf[id]||'')===s}">${s||'Все'} ${s?ts.filter(t=>t.status===s).length:ts.length}</button>`).join('')}</div>`;};

      ${p.notes.length?`<div class="list">${p.notes.map(n=>`<div class="card note-card"><textarea rows="1" data-change="note-edit" data-id="${p.id}" data-n="${n.id}" aria-label="Текст заметки">${esc(n.text)}</textarea><span class="tn-date">${fdate(n.t)}</span><button class="ibtn shown sm" data-act="note-del" data-id="${p.id}" data-n="${n.id}" type="button" aria-label="Удалить заметку">${ICON_X}</button></div>`).join('')}</div>`:'<div class="empty" style="padding:8px">Заметок пока нет.</div>'}

      ${shown.length?`<div class="tcard"><div class="scroll"><table class="tbl"><thead><tr><th class="c-title">Задача</th><th class="c-desc">Описание</th><th class="c-who">Ответственный</th><th class="c-created">Создана</th><th class="c-due">Срок</th><th class="c-stat">Статус</th><th class="c-prio">Приоритет</th><th class="c-act"><span style="position:absolute;left:-9999px">Действия</span></th></tr></thead><tbody>${rows}</tbody></table></div></div>`:(ts.length?`<div class="empty">Нет задач со статусом «${esc(fl)}». <button class="btn small" data-act="t-filter" data-id="${id}" data-s="" type="button">Показать все</button></div>`:'<div class="empty">В проекте пока нет задач. Нажми «+ Добавить задачу».</div>')}

S.draft=null;S.pending='';S.lastHash='';
function ideaOpen(id){const d=S.ideas.find(x=>x.id===id);S.focusIdea=!(d&&d.body);location.hash='idea-'+id;}
function ideaDirty(){const dr=S.draft;if(!dr)return false;const d=S.ideas.find(x=>x.id===dr.id);return !!d&&(dr.title.trim()!==d.text||dr.body!==(d.body||''));}
function ideaBarHtml(){const dirty=ideaDirty();
  return `<span class="istat ${dirty?'dirty':'clean'}">${dirty?'Есть несохранённые изменения':'Все изменения сохранены'}</span><button class="btn primary" data-act="idea-save" type="button"${dirty?'':' disabled'}>${dirty?'Сохранить':ICON_CHECK+'Сохранено'}</button>`;}
function ideaBarRefresh(){const b=$('#ibar');if(b)b.innerHTML=ideaBarHtml();}
function ideaSave(){const dr=S.draft;const d=dr&&S.ideas.find(x=>x.id===dr.id);if(!d)return false;
  if(!dr.title.trim()){toast('Название идеи не может быть пустым.');return false;}
  d.text=dr.title.trim();d.body=dr.body;dr.title=d.text;document.title=d.text+' — NQ';toast('Идея сохранена.');return true;}

const rtime=h=>h.time||'99:99';
function habitsSorted(){return [...S.habits].sort((a,b)=>rtime(a).localeCompare(rtime(b))||a.name.localeCompare(b.name,'ru'));}
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
function vRoutine(){

  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return {w:d.toLocaleDateString('ru-RU',{weekday:'short'}),n:d.getDate()};});
  const doneN=list.filter(h=>h.days[6]).length,pct=list.length?Math.round(doneN/list.length*100):0;

const diffDays=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);
const eachDay=(a,b)=>{const r=[];let d=a;while(d<=b&&r.length<400){r.push(d);d=addDays(d,1);}return r;};
const STMODES=[['week','Неделя'],['month','Месяц'],['d30','30 дней'],['custom','Свой период']];
const fullDay=s=>parseYmd(s).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'});
function statRange(){const td=TODAY(),m=S.st.mode,o=S.st.off;
  if(m==='week'){const a=addDays(mondayOfY(td),7*o);return [a,addDays(a,6)];}
  if(m==='month'){const d=parseYmd(td);return [ymd(new Date(d.getFullYear(),d.getMonth()+o,1)),ymd(new Date(d.getFullYear(),d.getMonth()+o+1,0))];}
  if(m==='d30'){const e=addDays(td,30*o);return [addDays(e,-29),e];}
  let a=S.st.from||addDays(td,-13),b=S.st.to||td;if(a>b){const x=a;a=b;b=x;}if(diffDays(a,b)>365)b=addDays(a,365);return [a,b];}
function statLabel(a,b){const A=parseYmd(a),B=parseYmd(b),yr=new Date().getFullYear(),wy=A.getFullYear()!==yr||B.getFullYear()!==yr;
  const f=(d,mo)=>d.toLocaleDateString('ru-RU',Object.assign({day:'numeric',month:mo},wy?{year:'numeric'}:{}));
  if(a===b)return f(A,'long');
  if(A.getMonth()===B.getMonth()&&A.getFullYear()===B.getFullYear())return `${A.getDate()} — ${f(B,'long')}`;
  return `${f(A,'short')} — ${f(B,'short')}`;}
function statShift(dir){const m=S.st.mode;
  if(m==='custom'){const [a,b]=statRange(),len=diffDays(a,b)+1;S.st.from=addDays(a,dir*len);S.st.to=addDays(b,dir*len);render();return;}
  if(dir>0&&S.st.off>=0){toast('Это текущий период, дальше данных ещё нет.');return;}
  S.st.off+=dir;render();}
function doneList(){return S.tasks.filter(x=>x.doneOn&&x.status==='Завершена').map(x=>({d:x.doneOn,p:x.project||''})).concat(S.archive.map(x=>({d:x.doneOn,p:x.project||''})));}
function habitDone(h,s){const td=TODAY();if(s>td)return false;const idx=6-diffDays(s,td);if(idx>=0&&idx<=6)return !!h.days[idx];return !!(h.hist&&h.hist[s]);}
function statCalc(a,b){
  const td=TODAY(),dates=eachDay(a,b),past=dates.filter(x=>x<=td),per={};dates.forEach(x=>{per[x]=0;});
  const dl=doneList();dl.forEach(e=>{if(e.d>=a&&e.d<=b)per[e.d]=(per[e.d]||0)+1;});
  const done=dates.reduce((s,x)=>s+per[x],0);
  const created=S.tasks.map(x=>x.created).concat(S.archive.map(x=>x.created)).filter(x=>x>=a&&x<=b).length;
  const hab=S.habits.map(h=>{const n=past.filter(x=>habitDone(h,x)).length;return {h,n,tot:past.length,pct:past.length?Math.round(n/past.length*100):0};});
  const hn=hab.reduce((s,x)=>s+x.n,0),ht=past.length*S.habits.length;
  const proj={};dl.forEach(e=>{if(e.d>=a&&e.d<=b)proj[e.p]=(proj[e.p]||0)+1;});
  let best=null;dates.forEach(x=>{if(per[x]>0&&(!best||per[x]>best.n))best={d:x,n:per[x]};});
  return {a,b,dates,past,per,done,created,hab,hpct:ht?Math.round(hn/ht*100):0,proj,best,avg:past.length?done/past.length:0};
}
const dlt=(d,u)=>d>0?`<span class="dl up">+${d}${u||''}</span>`:d<0?`<span class="dl down">−${-d}${u||''}</span>`:'<span class="dl">без изменений</span>';
function statBars(c){
  const td=TODAY(),grp=c.dates.length>31;let items;
  if(!grp)items=c.dates.map(d=>({n:c.per[d]||0,label:c.dates.length>9?parseYmd(d).getDate():DOW[(parseYmd(d).getDay()+6)%7],full:fullDay(d),href:d<=td?'#'+dayHash(d):'',fut:d>td,now:d===td}));
  else{const g={};c.dates.forEach(d=>{const m=mondayOfY(d);if(!g[m])g[m]={n:0,from:d,to:d};g[m].n+=c.per[d]||0;g[m].to=d;});
    items=Object.values(g).map(x=>({n:x.n,label:parseYmd(x.from).getDate(),full:`${fullDay(x.from)} — ${fullDay(x.to)}`,href:'',fut:x.from>td,now:x.from<=td&&td<=x.to}));}
  const max=Math.max(1,...items.map(i=>i.n));
  return `<div class="cbars${grp?' wk':''}">${items.map((i,idx)=>{const h=i.n?Math.max(7,Math.round(i.n/max*100)):0,tip=`${i.full}: ${i.n} ${pl(i.n,['задача','задачи','задач'])}`,tag=i.href?'a':'div';
    return `<${tag} class="cbar${i.now?' now':''}${i.fut?' fut':''}${i.n?'':' zero'}"${i.href?` href="${i.href}"`:' tabindex="0"'} data-tip="${esc(tip)}"${idx<items.length/2?' data-tl':' data-tr'} aria-label="${esc(tip)}"><span class="bv"><b>${i.n||''}</b><i style="height:${h}%"></i></span><em>${i.label}</em></${tag}>`;}).join('')}</div>`;
}
function statHeat(c){
  const td=TODAY();if(!S.habits.length)return '<div class="empty">Ежедневных задач пока нет.</div>';
  if(c.dates.length>31)return `<div class="heat">${c.hab.map(x=>`<div class="hrow"><a class="hname" href="#routine">${esc(x.h.name)}</a><div class="hbar" data-tip="${x.n} из ${x.tot} дней"><i style="width:${x.pct}%"></i></div><span class="hpct">${x.pct}%</span></div>`).join('')}</div>`;

  <div class="pfilter" style="margin-bottom:12px"><div class="seg" role="group" aria-label="Период">${STMODES.map(([k,l])=>`<button type="button" class="seg-btn" data-act="st-mode" data-m="${k}" aria-pressed="${S.st.mode===k}"><span>${l}</span></button>`).join('')}</div>
    ${S.st.mode==='custom'?`<div class="pf-right"><label class="chk">С<input type="date" class="mini" data-change="st-from" value="${a}" aria-label="Начало периода"></label><label class="chk">По<input type="date" class="mini" data-change="st-to" value="${b}" aria-label="Конец периода"></label></div>`:`<span class="muted small">${S.st.mode==='week'?'С понедельника по воскресенье':S.st.mode==='month'?'Календарный месяц':'Последние 30 дней'}</span>`}</div>

function vWeek(){
  const td=TODAY(),mon=addDays(mondayOfY(td),7*S.weekOff);
  const days=[...Array(7)].map((_,i)=>{const y=addDays(mon,i);return {y,l:DOW[i],n:parseYmd(y).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})};});
  const late=S.weekOff===0?S.tasks.filter(x=>x.repeat!=='daily'&&x.due&&x.due<mon&&!CLOSED.includes(x.status)):[];
  const wt=(x,s)=>{const rp=x.repeat==='daily',dn=doneAt(x,s),isLate=!rp&&!!x.due&&x.due<td&&!dn,dis=rp&&s!==td;
    return `<div class="wt${dn?' done':''}${isLate?' late':''}" data-open="${x.id}"><input type="checkbox" data-act="toggle-done" data-id="${x.id}" ${dn?'checked':''}${dis?' disabled':''} aria-label="Отметить выполненной: ${esc(x.title)}">

  <div class="weekwrap"><div class="weekgrid">${cols}</div></div>

function vAssistant(){
