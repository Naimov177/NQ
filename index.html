const COURSES=[
{id:'en',tag:'Английский',title:'Английский для работы',color:'#3B82F6',lvl:'A2 → B1+',
desc:`Практичный курс для тех, кто уже читает по-английски и хочет уверенно писать письма, участвовать в созвонах и вежливо просить о нужном.`,
goal:[`Без раздумий выбирать между Present Perfect и Past Simple`,`Писать понятные деловые письма и вежливо формулировать просьбы`,`Вести встречи и созвоны с готовыми фразами и фразовыми глаголами`],
l:[
{t:`Present Perfect и Past Simple: когда что`,m:15,
b:[`Past Simple говорит о завершённом действии в прошлом с чётким временем: I sent the report yesterday. Present Perfect связывает прошлое с настоящим: важен результат или опыт, а не момент, когда это произошло: I've sent the report, please check it.`,`Если в предложении есть yesterday, last week, in 2022, two days ago, нужен Past Simple. Если есть already, yet, just, ever, never, so far, this week, чаще всего нужен Present Perfect (have или has плюс третья форма глагола).`],
k:[`Конкретное время в прошлом: Past Simple.`,`Результат к настоящему моменту или жизненный опыт: Present Perfect.`,`Вопрос «Have you ever…?» спрашивает про опыт, а «When did you…?» уже требует Past Simple.`],
x:`I've finished the presentation (результат: можно смотреть). I finished it at 5 p.m. (когда именно).`,
p:`Напишите шесть предложений о своей рабочей неделе: три с Present Perfect (что уже сделано) и три с Past Simple (с указанием дня).`,
q:[[`Выберите правильный вариант: «I ___ the invoice yesterday.»`,[`have sent`,`sent`,`has sent`,`was sent`],1,`Есть слово yesterday, то есть конкретное время в прошлом. Значит, нужен Past Simple: sent.`],
[`Как правильно сказать: «Она уже написала письмо»?`,[`She wrote already the email.`,`She has already written the email.`,`She is already write the email.`,`She did already written the email.`],1,`Already указывает на результат к настоящему моменту, поэтому нужен Present Perfect: has already written.`],
[`Какой вопрос составлен верно?`,[`Have you seen him yesterday?`,`Did you see him yesterday?`,`Do you saw him yesterday?`,`Are you seen him yesterday?`],1,`С yesterday используется Past Simple: Did you see him yesterday?`]]},
{t:`Вежливые просьбы: could, would, would you mind`,m:12,
b:[`В английском вежливость выражается формой фразы, а не словом «please». Прямое Give me the file звучит как приказ. Нейтральная вежливая форма: Could you send me the file? Ещё мягче: Would you mind sending me the file? или I was wondering if you could send me the file.`,`Для разрешения подходят May I…? Could I…? Would it be OK if I…? А отказ смягчайте: I'm afraid I can't… вместо жёсткого No.`],
k:[`Could you плюс глагол: универсальная вежливая просьба.`,`После Would you mind глагол идёт с окончанием -ing: Would you mind closing the door?`,`I was wondering if… самая мягкая форма, подходит для руководителей и клиентов.`,`Отказ смягчайте словами I'm afraid… или Unfortunately…`],
x:`Нейтрально: Could you review this by Friday? Мягко: I was wondering if you could review this by Friday.`,
p:`Перепишите пять своих прямых рабочих просьб («Пришли отчёт», «Закрой задачу») в вежливой форме тремя разными способами.`,
q:[[`Какая фраза звучит вежливее всего?`,[`Send me the report.`,`Could you send me the report?`,`I was wondering if you could send me the report.`,`You must send me the report.`],2,`I was wondering if… самая мягкая из форм, она подходит для начальства и клиентов.`],
[`После «Would you mind» глагол стоит в форме…`,[`to плюс инфинитив`,`с окончанием -ing`,`простого инфинитива`,`третьей формы`],1,`Would you mind closing the door? После mind идёт форма на -ing.`],
[`Как вежливо отказаться?`,[`No, I won't.`,`I'm afraid I can't make it on Monday.`,`I don't want.`,`Impossible.`],1,`I'm afraid… смягчает отказ и звучит по-деловому.`]]},
{t:`Деловое письмо: структура и фразы`,m:15,
b:[`Хорошее письмо читают за 20 секунд. Структура: тема (Subject) в 5–8 словах, приветствие, цель в первом предложении, детали коротко, чёткое действие со сроком и вежливое завершение.`,`Полезные фразы: I'm writing to… (цель), Please find attached… (вложение), Could you confirm… by Friday? (действие), Thank you for your help (благодарность), Best regards (завершение).`],
k:[`Тема должна отвечать на вопросы «о чём» и «что нужно».`,`Цель письма указывайте в первом предложении.`,`Одно письмо: одна просьба и один срок.`,`Формулы завершения: Best regards, Kind regards.`],
x:`Subject: Q3 report, your review needed by Friday. Hi Anna, I'm writing to ask you to review the attached Q3 report by Friday.`,
p:`Напишите письмо коллеге: попросите проверить документ до конкретного дня. Уложитесь в пять предложений.`,
q:[[`Какая тема письма самая удачная?`,[`Hello`,`Question`,`Contract draft: please approve by Tue`,`Important!!!`],2,`Хорошая тема называет предмет и действие со сроком.`],
[`Где в письме лучше указать цель?`,[`В последнем абзаце`,`В первом предложении`,`В подписи`,`Нигде, пусть догадаются`],1,`Читатель должен понять цель сразу, до деталей.`],
[`Как сказать «Во вложении…»?`,[`Inside is…`,`Please find attached…`,`Look at attach…`,`Attached it is…`],1,`Стандартная деловая формула: Please find attached…`]]},
{t:`Созвоны и встречи: ключевые фразы`,m:12,
b:[`На встречах нужны не сложные слова, а готовые «рамки»: открыть, уточнить, высказать мнение, вежливо не согласиться, подвести итог.`,`Открытие: Let's get started. Уточнение: Could you elaborate on that? или Do you mean…? Мнение: In my view… Несогласие: I see your point, but… Итог: To sum up… или Let me recap.`],
k:[`Не поняли: переспросите, Sorry, could you repeat that?`,`Несогласие начинайте с признания: I see your point, but…`,`В конце подведите итог и назовите ответственных: Anna will send it by Friday.`],
x:`I see your point, but I'm concerned about the deadline. Could we move it by two days?`,
p:`Подготовьте и произнесите вслух пять фраз для своего ближайшего созвона: открытие, уточнение, мнение, несогласие, итог.`,
q:[[`Как вежливо попросить раскрыть мысль подробнее?`,[`What?`,`Could you elaborate on that?`,`Say again!`,`Explain now.`],1,`Could you elaborate on that? Вежливая просьба раскрыть мысль.`],
[`Какая фраза подходит для вежливого несогласия?`,[`You are wrong.`,`I see your point, but…`,`That's stupid.`,`No way.`],1,`Признаём позицию собеседника и только потом возражаем.`],
[`Чем лучше закончить встречу?`,[`Паузой`,`Итогом и ответственными со сроками`,`Новой темой`,`Шуткой`],1,`Рекап: что решили, кто и к какому сроку делает.`]]},
{t:`Фразовые глаголы для работы`,m:15,
b:[`Фразовые глаголы (глагол плюс частица) основа живого делового английского. Выучите восемь самых частых: follow up (вернуться к вопросу), set up (организовать), carry out (провести), look into (изучить), run out of (закончиться), put off (отложить), bring up (поднять тему), sort out (уладить).`,`Учите их не списком, а в своих предложениях: каждый глагол в одном примере из вашей работы.`],
k:[`Phrasal verbs учите в контексте, а не в алфавитном списке.`,`Следите за частицей: look into и look after значат разное.`,`Заведите карточки: глагол на одной стороне, ваш пример на другой.`],
x:`I'll look into it and follow up tomorrow. We ran out of time, so let's put it off until Monday.`,
p:`Составьте по одному предложению о своей работе с каждым из восьми глаголов и запишите их в карточки.`,
q:[[`Что значит «look into» в рабочем контексте?`,[`смотреть внутрь`,`изучить, разобраться`,`смотреть на улице`,`игнорировать`],1,`Look into something значит изучить вопрос, разобраться в нём.`],
[`Выберите: «We have ___ coffee.»`,[`run into`,`run out of`,`run away from`,`run over`],1,`We have run out of coffee: кофе закончился.`],
[`«Put off the meeting» означает…`,[`провести встречу`,`отложить встречу`,`отменить навсегда`,`записать встречу`],1,`Put off значит отложить, перенести на потом.`]]}
]},
{id:'sp',tag:'Ораторство',title:'Ораторское мастерство',color:'#F59E0B',lvl:'Начальный',
desc:`Курс о том, как структурировать мысль, управлять голосом и волнением и отвечать на вопросы так, чтобы вас слушали и запоминали.`,
goal:[`Строить выступление по понятному каркасу за несколько минут`,`Управлять голосом, темпом и паузами`,`Спокойно отвечать на вопросы и сложные реплики`],
l:[
{t:`Структура выступления`,m:14,
b:[`Слушатели запоминают начало, конец и две-три мысли в середине. Поэтому у любого выступления есть каркас: крючок (вопрос, факт или история), тезис «о чём и зачем», три опоры, вывод и призыв.`,`Для коротких ответов используйте PREP: Point (позиция), Reason (причина), Example (пример), Point (повтор позиции).`],
k:[`Правило трёх: не больше трёх опорных мыслей.`,`Крючок в первые 20 секунд решает, будут ли вас слушать.`,`Закончите призывом к действию, а не словами «ну, вот и всё».`],
x:`«Каждые 12 минут кто-то на встрече теряет нить. Сегодня три приёма, чтобы этого не было».`,
p:`Выберите тему на три минуты и запишите каркас: крючок, тезис, три опоры, призыв. Проговорите вслух.`,
q:[[`Сколько опорных мыслей оптимально в коротком выступлении?`,[`Одна или две`,`До трёх`,`Семь–десять`,`Сколько получится`],1,`Правило трёх: слушатель удержит две-три опоры.`],
[`Что означает PREP?`,[`Plan, Result, Evidence, Practice`,`Point, Reason, Example, Point`,`Prepare, Rehearse, Explain, Present`,`Problem, Reaction, Effect, Plan`],1,`PREP: позиция, причина, пример и снова позиция. Удобно для коротких ответов.`],
[`Какое начало выступления лучше всего?`,[`Извинения за волнение`,`Крючок: вопрос, факт или история`,`Длинное представление себя`,`Чтение слайда`],1,`Крючок сразу привлекает внимание, а извинения и чтение слайда его теряют.`]]},
{t:`Голос, темп и паузы`,m:12,
b:[`Комфортный для слушателя темп составляет 120–150 слов в минуту. Когда мы волнуемся, то ускоряемся до 180 и больше. Пауза в одну-две секунды после важной мысли работает как подчёркивание.`,`Дышите животом: вдох на три-четыре секунды, выдох на фразу. Меняйте высоту и громкость: монотонность усыпляет, а ударение на ключевых словах задаёт смысл.`],
k:[`Темп 120–150 слов в минуту; на ключевых мыслях замедляйтесь.`,`Пауза вместо слов-паразитов («э-э», «ну»).`,`Громкость чуть выше обычной, чтобы вас слышал последний ряд.`],
x:`Сравните: «Мы увеличим выручку на 20%» без паузы и «Мы увеличим выручку… на двадцать процентов» с паузой перед цифрой.`,
p:`Запишите на телефон одну минуту выступления, посчитайте слова-паразиты и темп. Повторите, сократив паразиты вдвое.`,
q:[[`Какой темп речи комфортен слушателю?`,[`60–80 слов в минуту`,`120–150 слов в минуту`,`200 и больше`,`Это не важно`],1,`Около 120–150 слов в минуту: достаточно быстро и ещё понятно.`],
[`Чем лучше заменить «э-э» и «ну»?`,[`Громким голосом`,`Короткой паузой`,`Быстрой речью`,`Повтором фразы`],1,`Пауза выглядит уверенно и даёт слушателям время подумать.`],
[`Зачем нужна пауза после важной мысли?`,[`Чтобы отдохнуло горло`,`Чтобы подчеркнуть мысль и дать её осознать`,`Чтобы проверить слайды`,`Чтобы подготовить шутку`],1,`Пауза работает как подчёркивание: слушатель успевает понять сказанное.`]]},
{t:`Волнение: как превратить его в ресурс`,m:14,
b:[`Волнение это физиологическое возбуждение: пульс, адреналин. Исследования показывают, что переосмысление «я волнуюсь» в «я заряжен» улучшает результат. Подавлять волнение бесполезно, лучше направить его в энергию.`,`Что реально помогает: заранее выученные первые 30 секунд, дыхание 4–6 (вдох четыре секунды, выдох шесть), фокус на пользе для слушателей, а не на себе, и репетиции в условиях, близких к реальным.`],
k:[`Не «успокойся», а «я заряжен»: переосмысление работает лучше подавления.`,`Первые 30 секунд знайте наизусть, остальное свободно.`,`Выдох длиннее вдоха успокаивает пульс.`],
x:`Перед выходом: три минуты дыхания 4–6, затем одна фраза: «Я здесь, чтобы помочь им разобраться».`,
p:`Перед ближайшим выступлением сделайте дыхание 4–6 три минуты и выучите первые 30 секунд наизусть.`,
q:[[`Что лучше сказать себе перед выступлением?`,[`Я не должен волноваться`,`Я заряжен и готов`,`Только бы не ошибиться`,`Все смотрят на меня`],1,`Переосмысление волнения как энергии улучшает результат, подавление не помогает.`],
[`Что стоит знать наизусть?`,[`Весь текст`,`Первые 30 секунд`,`Только заключение`,`Ничего`],1,`Уверенный старт снимает большую часть напряжения.`],
[`Дыхание 4–6 это…`,[`вдох 4 секунды, выдох 6`,`вдох 6, выдох 4`,`4 вдоха за 6 секунд`,`задержка дыхания на 10 секунд`],0,`Выдох длиннее вдоха успокаивает.`]]},
{t:`Истории: как запоминаться`,m:14,
b:[`Мозг запоминает истории намного лучше, чем списки фактов. Простая арка: контекст (кто, где), конфликт (проблема, ставки), решение, вывод для слушателя.`,`Конкретика важнее общих слов: имя, число, деталь. Одна история несёт одну мысль. И всегда связывайте историю с тезисом словом «поэтому».`],
k:[`Арка: контекст, конфликт, решение, вывод.`,`Конкретные детали делают историю живой.`,`История без связи с тезисом лишь украшение.`],
x:`Вместо «у нас были проблемы с поставками» скажите: «В марте фура с оборудованием застряла на границе на шесть дней, и мы потеряли клиента».`,
p:`Подготовьте 60-секундную историю из своей практики по схеме: контекст, конфликт, решение, вывод.`,
q:[[`Из чего состоит простая арка истории?`,[`Введение, факты, вывод`,`Контекст, конфликт, решение, вывод`,`Шутка, цитата, график`,`Тезис, довод, пример`],1,`Контекст, конфликт, решение и вывод: так устроено большинство запоминающихся историй.`],
[`Что делает историю убедительной?`,[`Общие слова`,`Конкретные детали: имена, числа`,`Длинное вступление`,`Сложные термины`],1,`Конкретика создаёт образ и доверие.`],
[`Как использовать историю в выступлении?`,[`Как украшение без связи`,`Связать с тезисом: «поэтому…»`,`Поставить в конец, чтобы развлечь`,`Прочитать с листа`],1,`История должна подкреплять главную мысль, иначе она отвлекает.`]]},
{t:`Вопросы из зала и сложные ситуации`,m:14,
b:[`Вопрос это возможность. Алгоритм: дослушать до конца, сделать паузу, перефразировать вопрос (проверка понимания и время подумать), ответить коротко (30–60 секунд) и проверить: «Отвечает ли это на ваш вопрос?»`,`Если не знаете ответа, скажите: «Не готов ответить точно, уточню и напишу вам до завтра». Если вопрос враждебный, отвечайте по сути, а не на тон, и не вступайте в спор.`],
k:[`Пауза и перефразирование дают время подумать.`,`Честное «уточню и отвечу» лучше выдуманного ответа.`,`На враждебный тон отвечайте спокойной сутью.`],
x:`«Если я правильно понял, вы спрашиваете, почему мы выбрали этот срок. Коротко: так мы успеваем до начала сезона».`,
p:`Придумайте пять самых неудобных вопросов к вашему выступлению и подготовьте короткие ответы на каждый.`,
q:[[`С чего начать ответ на вопрос из зала?`,[`С немедленного ответа`,`С паузы и перефразирования вопроса`,`С возражения`,`С шутки`],1,`Пауза и перефразирование дают время подумать и проверяют, что вы поняли вопрос.`],
[`Если вы не знаете ответа, лучше…`,[`придумать`,`честно сказать и пообещать уточнить к сроку`,`уйти от темы`,`обвинить спрашивающего`],1,`Честность укрепляет доверие, а выдуманный ответ его разрушает.`],
[`Как реагировать на враждебный тон?`,[`Ответить тем же`,`Отвечать по сути, а не на тон`,`Игнорировать зал`,`Закончить выступление`],1,`Спокойный ответ по существу показывает уверенность и не разжигает спор.`]]}
]},
{id:'mg',tag:'Менеджмент',title:'Менеджмент и лидерство',color:'#10B981',lvl:'Начальный',
desc:`Базовые инструменты руководителя: поручения, обратная связь, цели, встречи один на один и работа с конфликтами.`,
goal:[`Делегировать результат, а не просто задачу`,`Давать обратную связь по модели SBI`,`Ставить цели через OKR и вести встречи один на один`],
l:[
{t:`Делегирование`,m:14,
b:[`Делегирование это передача результата, а не просто задачи. Хорошее поручение отвечает на пять вопросов: что нужно получить, зачем это нужно, к какому сроку, по каким критериям оценивается качество и какие полномочия и ресурсы есть у исполнителя.`,`Не диктуйте «как», если это не критично: человек вырастет и найдёт свой путь. Договоритесь о контрольных точках и проверяйте результат, а не каждый шаг.`],
k:[`Передавайте результат и контекст, а не шаги.`,`Срок, критерии качества и контрольные точки обязательны.`,`Доверяйте и проверяйте по точкам, а не микроменеджментом.`],
x:`Вместо «сделай отчёт» скажите: «Нужен отчёт по продажам за квартал, чтобы мы решили по бюджету. К четвергу, на одну страницу, с тремя выводами. Если нужны данные, обратись к Анне».`,
p:`Выберите одну свою задачу и оформите поручение по пяти пунктам: результат, зачем, срок, критерии, полномочия.`,
q:[[`Что обязательно включить в хорошее поручение?`,[`Только название задачи`,`Результат, срок и критерии качества`,`Подробную инструкцию по шагам`,`Предупреждение о наказании`],1,`Исполнитель должен знать, что получить, к какому сроку и как оценят результат.`],
[`Чем делегирование отличается от «сбросить задачу»?`,[`Ничем`,`Передаётся ответственность за результат вместе с полномочиями и контекстом`,`Меньшим числом разговоров`,`Отсутствием сроков`],1,`Делегируя, вы передаёте результат, контекст и полномочия, а не просто работу.`],
[`Как лучше контролировать исполнение?`,[`Проверять каждый шаг`,`По согласованным контрольным точкам`,`Не контролировать вообще`,`Только после срока`],1,`Контрольные точки дают управляемость без микроменеджмента.`]]},
{t:`Обратная связь: модель SBI`,m:14,
b:[`Модель SBI: Situation (ситуация), Behavior (наблюдаемое поведение), Impact (влияние). Пример: «На вчерашнем созвоне вы три раза перебили клиента, и он перестал задавать вопросы».`,`Говорите о фактах, а не о личности: «вы безответственный» это оценка, а «отчёт сдан на два дня позже» это факт. Давайте обратную связь быстро, критику наедине, а похвалу при коллегах. После спросите: «Как вы это видите?»`],
k:[`Факты и поведение, а не ярлыки.`,`Критика наедине, похвала публично.`,`После высказывания дайте человеку ответить.`],
x:`«В среду на встрече (ситуация) вы показали клиенту готовый прототип без согласования (поведение), и он ожидает запуска уже на этой неделе (влияние)».`,
p:`Подготовьте две обратные связи по SBI: одну положительную и одну корректирующую.`,
q:[[`Что означает буква B в SBI?`,[`Benefit`,`Behavior: наблюдаемое поведение`,`Budget`,`Boss`],1,`B это Behavior: то, что можно увидеть и услышать, без оценок.`],
[`Какая формулировка соответствует SBI?`,[`Вы вечно всё срываете`,`В среду вы пришли на 15 минут позже, и нам пришлось начать без вас`,`Вы безответственный`,`С вами тяжело работать`],1,`В ней есть ситуация, конкретное поведение и последствие, без оценки личности.`],
[`Где лучше давать корректирующую обратную связь?`,[`При всей команде`,`Наедине`,`В общем чате`,`Никогда`],1,`Публичная критика вызывает защиту, а наедине человек слышит суть.`]]},
{t:`Цели: SMART и OKR`,m:15,
b:[`SMART описывает качество формулировки цели: Specific (конкретная), Measurable (измеримая), Achievable (достижимая), Relevant (значимая), Time-bound (ограничена во времени).`,`OKR: Objective это вдохновляющая цель простыми словами; Key Results это три-пять измеримых результатов, по которым ясно, достигнута ли цель. Хорошие KR описывают результат, а не активность: «Повысить конверсию с 2% до 3%», а не «Провести 10 встреч».`],
k:[`Цель должна быть измеримой и иметь срок.`,`KR это результат с числом, а не список дел.`,`В OKR допустима амбициозность: выполнение на 70% уже хороший итог.`],
x:`Objective: сделать онбординг клиентов быстрым и понятным. KR: время до первого результата с 14 до 5 дней; оценка онбординга выше 4,5; доля завершивших шаги выше 80%.`,
p:`Сформулируйте одну цель на квартал в виде OKR: одна цель и три ключевых результата с числами.`,
q:[[`Что должно быть в Key Result?`,[`Список активностей`,`Измеримый результат с числом`,`Только название`,`Настроение команды`],1,`KR показывает достижение измеримым числом.`],
[`Что означает T в SMART?`,[`Team`,`Time-bound: ограничена по времени`,`Top`,`Task`],1,`Цель без срока легко откладывается.`],
[`Какой KR сформулирован лучше?`,[`Провести 10 встреч`,`Увеличить число повторных клиентов с 20 до 30`,`Улучшить сервис`,`Быть лучше конкурентов`],1,`Он измерим и описывает результат, а не активность.`]]},
{t:`Встречи один на один`,m:12,
b:[`Регулярная встреча один на один (30 минут раз в неделю или две) главный инструмент руководителя. Это время сотрудника, а не отчёт для вас: повестку в основном определяет он.`,`Структура: самочувствие, что мешает (блокеры), рост и обучение, обратная связь в обе стороны, договорённости. Записывайте итоги и выполняйте свои обещания: так строится доверие.`],
k:[`Это время сотрудника, а не статус-встреча.`,`Не отменяйте: перенос сообщает, что человек неважен.`,`Фиксируйте договорённости и выполняйте свои.`],
x:`Три вопроса на старт: «Что сейчас мешает?», «Чему вы хотите научиться?», «Чем я могу помочь?»`,
p:`Запланируйте встречи один на один с каждым и подготовьте три вопроса: что мешает, чему хотите научиться, чем помочь.`,
q:[[`Чьё время на встрече один на один?`,[`Руководителя`,`Сотрудника`,`Заказчика`,`Ничьё`],1,`Повестку формирует в основном сотрудник, руководитель слушает и помогает.`],
[`Как часто лучше проводить такие встречи?`,[`Раз в год`,`Раз в неделю или две`,`Только при проблемах`,`Раз в квартал`],1,`Регулярность строит доверие и снимает проблемы заранее.`],
[`Что важно сделать после встречи?`,[`Забыть о ней`,`Записать договорённости и выполнить свои`,`Рассказать критику команде`,`Ничего`],1,`Выполненные обещания создают доверие.`]]},
{t:`Конфликты: интересы вместо позиций`,m:14,
b:[`Конфликт это столкновение интересов, и он не всегда плох. Томас и Килманн выделяют пять стилей: соперничество, сотрудничество, компромисс, избегание и уступчивость. Универсального лучшего нет: сотрудничество подходит для важных вопросов, избегание для мелочей.`,`Эффективный путь: отделить людей от проблемы, выяснить интересы (зачем это нужно каждому), предложить несколько вариантов и выбрать по объективным критериям.`],
k:[`Сотрудничество для важного, избегание для мелочей.`,`Спрашивайте «зачем», а не «кто виноват».`,`Выбирайте решение по критериям, а не по давлению.`],
x:`Вместо «ты опять срываешь сроки» спросите: «Что мешает уложиться? Как нам сделать так, чтобы сроки были реалистичными?»`,
p:`Вспомните недавний конфликт. Запишите позиции сторон и их интересы. Найдите вариант, который устроил бы всех.`,
q:[[`Какой стиль подходит для действительно важной общей задачи?`,[`Избегание`,`Сотрудничество`,`Уступчивость`,`Соперничество`],1,`Сотрудничество ищет решение, которое устраивает все стороны.`],
[`Что нужно выяснять в конфликте?`,[`Кто виноват`,`Интересы сторон: зачем им это нужно`,`Кто громче`,`Прошлые обиды`],1,`Интересы позволяют найти решение, которое не видно за позициями.`],
[`Как лучше выбирать решение?`,[`По настроению`,`По объективным критериям`,`По старшинству`,`Жребием`],1,`Объективные критерии снижают спор о том, кто прав.`]]}
]},
{id:'pr',tag:'Продуктивность',title:'Продуктивность и фокус',color:'#8B5CF6',lvl:'Начальный',
desc:`Система личной эффективности: приоритеты, глубокий фокус, недельное планирование, разбор входящих и энергия.`,
goal:[`Отличать важное от срочного и вкладываться в важное`,`Работать глубоко: блоки внимания без отвлечений`,`Планировать неделю и разбирать входящие по системе`],
l:[
{t:`Матрица Эйзенхауэра`,m:12,
b:[`Задачи делятся по двум осям: важность и срочность. Квадрант 1: важно и срочно, делайте сразу. Квадрант 2: важно, но не срочно, планируйте: здесь рост, здоровье, отношения, стратегия. Квадрант 3: срочно, но не важно, делегируйте или ограничьте. Квадрант 4: не срочно и не важно, уберите.`,`Секрет эффективных людей: вкладывать время в квадрант 2, пока он не стал квадрантом 1.`],
k:[`Квадрант 2 место роста и профилактики кризисов.`,`Срочное кажется важным, но часто им не является.`,`Планируйте квадрант 2 блоками в календаре.`],
x:`Подготовка к экзамену за месяц квадрант 2. Подготовка за ночь до экзамена квадрант 1, и стоит дороже.`,
p:`Разложите все задачи этой недели по четырём квадрантам и запланируйте два блока времени на квадрант 2.`,
q:[[`В какой квадрант попадают рост навыков и стратегия?`,[`Срочно и важно`,`Важно, но не срочно`,`Срочно, но не важно`,`Не срочно и не важно`],1,`Это квадрант 2: важное, что можно спланировать.`],
[`Что делать с задачами «срочно, но не важно»?`,[`Делать первыми`,`Делегировать или ограничить`,`Игнорировать всегда`,`Планировать на вечер`],1,`Они отнимают время, но мало влияют на цели.`],
[`Почему квадрант 2 так важен?`,[`В нём меньше задач`,`Он предотвращает кризисы и даёт долгосрочный результат`,`Он самый лёгкий`,`Его никто не любит`],1,`Вложения в квадрант 2 не дают задачам превратиться в авралы.`]]},
{t:`Глубокая работа`,m:12,
b:[`Глубокая работа это сосредоточенная работа без отвлечений над сложной задачей. Она создаёт большую часть ценности, но требует времени: после каждого переключения внимания нужно несколько минут, чтобы вернуться в контекст.`,`Практика: блок 60–90 минут в одно и то же время, уведомления выключены, одна задача, понятный результат блока. Начните с одного блока в день.`],
k:[`Один блок: одна задача и один ожидаемый результат.`,`Телефон и уведомления выключены.`,`Ритуал и постоянное время помогают быстрее входить в фокус.`],
x:`Блок 9:00–10:30: написать черновик документа. Чат закрыт, телефон в другой комнате, результат: готовый черновик.`,
p:`Запланируйте пять блоков глубокой работы на неделю по 60–90 минут и проведите первый завтра.`,
q:[[`Сколько оптимально длится блок глубокой работы?`,[`5 минут`,`60–90 минут`,`4 часа без перерыва`,`15 секунд`],1,`Около 60–90 минут: хватает на погружение, но внимание ещё не падает.`],
[`Что главное в блоке?`,[`Много вкладок`,`Одна задача и выключенные уведомления`,`Фоновые сообщения`,`Музыка со словами`],1,`Одна задача и отсутствие отвлечений дают глубину.`],
[`Почему вредны частые переключения?`,[`Они не вредны`,`Каждое требует времени на возвращение в контекст`,`Они экономят время`,`Они всегда повышают креативность`],1,`Время на возвращение в контекст накапливается и съедает час-два в день.`]]},
{t:`Планирование недели`,m:12,
b:[`Раз в неделю (в воскресенье вечером или в понедельник утром) проводите обзор: что сделано, что важно на этой неделе, какие три главных результата. Затем разложите их по календарю блоками времени: задача без времени в календаре часто остаётся невыполненной.`,`Оставляйте 20–30% времени свободным: по закону Паркинсона работа растягивается на всё отведённое время, а непредвиденные дела неизбежны.`],
k:[`Три главных результата недели вместо длинного списка.`,`Задача получает время в календаре.`,`Свободный запас 20–30%.`],
x:`Три результата: отправить предложение клиенту, закончить урок по менеджменту, провести три тренировки. Каждому свой блок в календаре.`,
p:`Проведите недельный обзор по трём вопросам (что получилось, что важно, какие три результата) и разместите результаты в календаре.`,
q:[[`Сколько главных результатов на неделю разумно выбрать?`,[`Один–три`,`Пятнадцать`,`Сколько получится`,`Ни одного`],0,`Небольшое число ясных результатов легче довести до конца.`],
[`Зачем оставлять свободное время?`,[`Чтобы не работать`,`Для непредвиденных дел и гибкости`,`Чтобы меньше планировать`,`Это ошибка`],1,`Запас защищает план от срыва при первом же сюрпризе.`],
[`Что делает задачу выполнимой?`,[`Хорошее название`,`Конкретное время в календаре`,`Красивый список`,`Сила воли`],1,`Задача с конкретным временем получает шанс на выполнение.`]]},
{t:`Входящие и правило двух минут`,m:12,
b:[`Идеи и задачи нельзя держать в голове: записывайте всё в одно место (Входящие), а разбирайте позже. Для каждого пункта спросите: нужно ли действие? Если да и оно займёт меньше двух минут, сделайте сразу. Иначе отложите в план с датой или делегируйте.`,`Разбирайте входящие регулярно (раз в день): иначе доверие к системе падает.`],
k:[`Записать сразу, решить потом.`,`Дело короче двух минут сделайте немедленно.`,`Разбор раз в день.`],
x:`«Ответить на письмо про счёт» занимает минуту: делайте сразу. «Подготовить отчёт» займёт час: в план на конкретный день.`,
p:`Разберите свои входящие по алгоритму: нет действия, значит удалить или в идеи; меньше двух минут, значит сделать; иначе в план.`,
q:[[`Что делать с делом короче двух минут?`,[`Сделать сразу`,`Отложить на месяц`,`Записать и забыть`,`Всегда делегировать`],0,`Накладные расходы на хранение и возвращение больше самого дела.`],
[`Для чего нужны «Входящие»?`,[`Хранить важное навсегда`,`Быстро записывать, а решать потом`,`Заменять календарь`,`Хранить пароли`],1,`Они освобождают голову: мысль записана, решение отложено.`],
[`Как часто разбирать входящие?`,[`Раз в год`,`Регулярно, лучше раз в день`,`Никогда`,`Только в отпуске`],1,`Регулярный разбор поддерживает доверие к системе.`]]},
{t:`Энергия и отдых`,m:12,
b:[`Продуктивность это не только время, но и энергия. Внимание работает циклами примерно по 90 минут, после которых нужен перерыв. Сон 7–9 часов, движение и паузы повышают качество решений.`,`Метод Pomodoro: 25 минут работы, 5 минут отдыха; после четырёх циклов длинный перерыв 15–30 минут. Перерыв без телефона восстанавливает лучше, чем соцсети.`],
k:[`Сон 7–9 часов важнее лишних часов работы.`,`Перерыв без экрана восстанавливает лучше.`,`Pomodoro: 25 минут работы и 5 минут отдыха.`],
x:`Работа 25 минут, затем пять минут: встать, потянуться, выпить воды. Не открывать ленту новостей.`,
p:`Проведите четыре помидорных цикла сегодня и отметьте, как менялась концентрация.`,
q:[[`Сколько длится классический цикл Pomodoro?`,[`25 минут работы, 5 минут отдыха`,`60 минут работы`,`10 минут работы`,`2 часа`],0,`Классика: 25 минут работы и 5 минут отдыха.`],
[`Сколько сна нужно взрослому в среднем?`,[`4–5 часов`,`7–9 часов`,`10–12 часов`,`Это не важно`],1,`Хронический недосып заметно снижает внимание и память.`],
[`Какой перерыв восстанавливает лучше?`,[`Лента соцсетей`,`Короткая прогулка или упражнения без телефона`,`Ещё одна задача`,`Кофе подряд`],1,`Движение и отсутствие экрана дают мозгу реальный отдых.`]]}
]},
{id:'ct',tag:'Мышление',title:'Критическое мышление',color:'#EC4899',lvl:'Начальный',
desc:`Как не поддаваться когнитивным искажениям, замечать логические ошибки, проверять утверждения и принимать взвешенные решения.`,
goal:[`Замечать у себя и других основные когнитивные искажения`,`Распознавать частые логические ошибки в аргументах`,`Принимать решения с учётом обратимости и рисков`],
l:[
{t:`Когнитивные искажения`,m:14,
b:[`Мозг экономит усилия и использует шаблоны, которые иногда ошибаются. Подтверждающее искажение: мы замечаем факты, которые согласуются с нашей идеей. Якорение: первая услышанная цифра влияет на оценку. Ошибка невозвратных затрат: «уже вложил, значит надо продолжать». Эвристика доступности: частоту событий оцениваем по яркости примеров.`,`Защита: искать опровергающие данные, оценивать заново с чистого листа, спрашивать себя: «Если бы я начинал сегодня, продолжил бы?»`],
k:[`Ищите данные, которые могут опровергнуть вашу идею.`,`Прошлые вложения не повод продолжать.`,`Свою оценку делайте до того, как услышали чужую цифру.`],
x:`Вы полгода идёте на курс, который не нравится, «потому что уже заплатил». Прошлые деньги потрачены в любом случае: решайте по будущей пользе.`,
p:`Вспомните решение, где вы упрямо продолжали из-за уже вложенных усилий. Что бы вы выбрали сегодня «с нуля»?`,
q:[[`Подтверждающее искажение это…`,[`поиск фактов, подтверждающих нашу идею`,`подтверждение банковских операций`,`подтверждение личности`,`отказ от идей`],0,`Мы склонны замечать только то, что согласуется с нашим мнением.`],
[`Ошибка невозвратных затрат это…`,[`продолжать из-за уже вложенного, а не из-за будущей пользы`,`экономия денег`,`покупка по низкой цене`,`страх вложений`],0,`Прошлые затраты нельзя вернуть, поэтому решение зависит от будущего.`],
[`Как защититься от якорения?`,[`Принять первую цифру`,`Составить собственную оценку до чужой цифры`,`Никому не верить`,`Торговаться`],1,`Собственная оценка до знакомства с якорем снижает его влияние.`]]},
{t:`Аргументы и логические ошибки`,m:14,
b:[`Аргумент состоит из утверждения и оснований. Частые ошибки: ad hominem (нападение на человека вместо довода), соломенное чучело (искажение чужой позиции), ложная дилемма («или так, или так» при наличии других вариантов), post hoc (после, значит вследствие), ссылка на авторитет вместо доказательств.`,`Проверка: можете ли вы пересказать позицию оппонента так, чтобы он согласился? Есть ли третий вариант? Это причина или совпадение?`],
k:[`Оценивайте довод, а не человека.`,`Пересказывайте позицию оппонента честно.`,`Сначала ищите третий вариант, потом выбирайте из двух.`],
x:`«Он не разбирается в финансах, он ещё молод» это ad hominem: возраст не опровергает довод.`,
p:`Найдите в новостях или обсуждениях три примера логических ошибок и назовите каждую.`,
q:[[`«Он не разбирается, потому что молод» это…`,[`аргумент по существу`,`ad hominem`,`статистика`,`логичный вывод`],1,`Это нападение на человека, а не на довод.`],
[`Ложная дилемма это…`,[`рассмотрение всех вариантов`,`выбор из двух, когда есть другие варианты`,`умная шутка`,`строгий довод`],1,`«Или так, или так» скрывает остальные варианты.`],
[`Post hoc ergo propter hoc означает…`,[`после, значит вследствие (ошибка)`,`перед событием`,`подробное доказательство`,`общая причина`],0,`Последовательность во времени сама по себе не доказывает причину.`]]},
{t:`Вопросы, которые стоит задавать`,m:12,
b:[`Критическое мышление это набор вопросов: кто говорит и зачем? Какие доказательства? Откуда данные? Есть ли альтернативные объяснения? Что я мог пропустить? Что изменило бы моё мнение?`,`Особенно полезны два вопроса: «Как мы это узнали?» и «Что будет, если я неправ?»`],
k:[`Требуйте источник и способ получения данных.`,`Ищите альтернативные объяснения.`,`Заранее определяйте, что изменит ваше мнение.`],
x:`Услышав «исследование доказало», спросите: на ком проводилось, каков размер выборки, с чем сравнивали.`,
p:`Возьмите громкое утверждение из новостей и задайте ему шесть вопросов из списка. Запишите ответы.`,
q:[[`Какой вопрос помогает проверить утверждение?`,[`Кто ещё так думает?`,`Какие доказательства и откуда данные?`,`Нравится ли мне вывод?`,`Громко ли это сказано?`],1,`Доказательства и источник данных проверяют основу утверждения.`],
[`«Что изменило бы моё мнение?» помогает…`,[`упереться`,`определить критерии пересмотра взглядов`,`спорить`,`закончить разговор`],1,`Если ничто не может изменить мнение, это уже вера, а не вывод.`],
[`Альтернативные объяснения нужны, чтобы…`,[`усложнить`,`не принять первую версию за единственную`,`выиграть спор`,`затянуть`],1,`Первое объяснение редко единственное.`]]},
{t:`Статистика в быту`,m:14,
b:[`Корреляция не равна причинности: два показателя могут расти вместе из-за третьего (продажи мороженого и несчастные случаи на воде зависят от жары). Среднее искажается выбросами, поэтому смотрите медиану. Ошибка выжившего: изучаем только успешных и не видим тех, кто провалился. Базовая частота: редкое событие остаётся редким даже при «точном» тесте.`,`Перед выводами спрашивайте: размер выборки, как собирали данные, с чем сравнивали.`],
k:[`Совместное изменение не доказывает причину.`,`При выбросах смотрите медиану.`,`Помните о тех, кого не видно: о «невыживших».`],
x:`«Успешные компании делают X». А сколько неуспешных делали то же самое? Мы их просто не видим.`,
p:`Найдите в вашей работе показатель, где среднее может обманывать, и посчитайте для него медиану.`,
q:[[`Что такое ошибка выжившего?`,[`анализ только успешных случаев`,`страх выжить`,`опрос всех участников`,`расчёт среднего`],0,`Мы видим только тех, кто «выжил», и делаем неверные выводы.`],
[`Когда лучше смотреть на медиану, а не на среднее?`,[`Когда есть сильные выбросы`,`Всегда`,`Никогда`,`Когда мало данных`],0,`Медиана устойчива к выбросам, а среднее нет.`],
[`Корреляция означает…`,[`причинность`,`совместное изменение показателей, не обязательно причину`,`ошибку`,`отсутствие связи`],1,`Связь по данным не говорит, что один показатель вызывает другой.`]]},
{t:`Принятие решений`,m:14,
b:[`Решения бывают обратимые («двусторонняя дверь») и необратимые («односторонняя дверь»). Обратимые принимайте быстро и пробуйте, необратимые медленно, собирая данные.`,`Полезные приёмы: pre-mortem (представьте, что проект провалился, и заранее назовите причины), правило 10/10/10 (как вы оцените решение через 10 минут, 10 месяцев и 10 лет), и ставка на ожидаемую ценность, а не на результат одного случая.`],
k:[`Обратимое решайте быстро, необратимое тщательно.`,`Pre-mortem находит риски до старта.`,`Оценивайте решение по качеству процесса, а не только по исходу.`],
x:`Перед запуском проекта соберите команду и спросите: «Прошёл год, проект провалился. Почему?» Запишите причины и устраните главные.`,
p:`Выберите предстоящее решение и проведите pre-mortem: назовите пять причин, почему оно могло бы не сработать.`,
q:[[`Pre-mortem это…`,[`разбор после провала`,`заранее представить провал и найти причины`,`отказ от решения`,`опрос клиентов`],1,`Вы ищете риски заранее, пока их можно устранить.`],
[`Как принимать обратимые решения?`,[`Очень долго`,`Быстро, пробуя и корректируя`,`Никогда`,`Только голосованием`],1,`Цена ошибки невелика, а скорость даёт обучение.`],
[`10/10/10 это…`,[`оценка решения через 10 минут, 10 месяцев и 10 лет`,`десять вариантов`,`десять голосов`,`десять правил`],0,`Приём помогает сопоставить краткосрочные и долгосрочные последствия.`]]}
]},
{id:'ng',tag:'Переговоры',title:'Переговоры и влияние',color:'#06B6D4',lvl:'Начальный',
desc:`Переговоры по принципам: интересы, BATNA, активное слушание, якорение и сложные разговоры.`,
goal:[`Искать интересы за позициями и находить выгодные обеим сторонам решения`,`Готовиться к переговорам и знать свою альтернативу`,`Слушать, уступать и вести трудные разговоры спокойно`],
l:[
{t:`Интересы, а не позиции`,m:12,
b:[`Позиция это то, чего человек требует («хочу скидку 20%»). Интерес это зачем («у меня бюджет до конца квартала»). За противоположными позициями часто скрываются совместимые интересы. Классический пример: двое спорят за апельсин, одному нужна мякоть, другому цедра.`,`Задавайте вопросы «Что для вас здесь самое важное?» и «Зачем это нужно?» Ищите варианты, где выигрывают обе стороны.`],
k:[`Спрашивайте «зачем», а не только «сколько».`,`Интересы часто совместимы.`,`Предлагайте несколько вариантов, а не один.`],
x:`Клиент требует скидку. Выяснилось, что ему важен бюджет этого квартала, а не цена. Решение: оплата частями с тем же итогом.`,
p:`Вспомните недавние переговоры. Запишите позиции сторон и их интересы. Нашёлся ли вариант, который устраивал бы обе стороны?`,
q:[[`Позиция это…`,[`то, чего человек требует`,`зачем ему это нужно`,`скрытая мотивация`,`результат переговоров`],0,`Позиция видна в требовании, а интерес скрыт за ним.`],
[`Какой вопрос выявляет интерес?`,[`Сколько вы хотите?`,`Что для вас здесь самое важное?`,`Когда вы согласитесь?`,`Кто виноват?`],1,`Он ведёт к причинам и потребностям.`],
[`Почему полезно искать интересы?`,[`Чтобы давить`,`Чтобы находить решения, выгодные обеим сторонам`,`Чтобы затянуть`,`Нет смысла`],1,`Интересы часто совместимы, в отличие от позиций.`]]},
{t:`BATNA: подготовка к переговорам`,m:14,
b:[`BATNA (Best Alternative To a Negotiated Agreement) это ваша лучшая альтернатива, если договориться не удастся. Чем сильнее BATNA, тем увереннее вы ведёте переговоры. Подготовьте: свою BATNA, минимально приемлемый результат (точку отказа), желаемый результат и оценку BATNA другой стороны.`,`Зона возможного соглашения (ZOPA) существует, когда точки отказа сторон пересекаются.`],
k:[`Прежде чем идти на переговоры, улучшайте свою BATNA.`,`Знайте точку отказа и не выходите за неё.`,`Оценивайте BATNA другой стороны.`],
x:`Перед обсуждением зарплаты вы получили второе предложение. Это ваша BATNA: вы спокойно можете отказаться от слабых условий.`,
p:`Для ближайших переговоров запишите: свою BATNA, точку отказа, желаемый результат и предполагаемую BATNA другой стороны.`,
q:[[`Что означает BATNA в переговорах?`,[`лучшая альтернатива соглашению`,`любимая цель`,`баланс сторон`,`договор`],0,`BATNA это ваш лучший вариант на случай, если договориться не получится.`],
[`Что даёт сильная BATNA?`,[`Уверенность и более сильную позицию`,`Ничего`,`Меньше вариантов`,`Необходимость соглашаться`],0,`Если у вас есть хорошая альтернатива, вы не зависите от одного соглашения.`],
[`ZOPA существует, когда…`,[`точки отказа сторон пересекаются`,`стороны ссорятся`,`один молчит`,`нет сроков`],0,`Только тогда есть результат, который приемлем для обеих сторон.`]]},
{t:`Активное слушание`,m:12,
b:[`Слушание главный навык переговорщика. Приёмы: перефразирование («Если я правильно понял…»), называние эмоций («Похоже, вас это беспокоит»), открытые вопросы («Расскажите подробнее»), пауза и молчание: после них человек часто раскрывает главное.`,`Не перебивайте и не готовьте ответ, пока слушаете. Резюмируйте услышанное: это снижает напряжение и показывает уважение.`],
k:[`Перефразируйте, чтобы проверить понимание.`,`Называйте эмоцию без оценки.`,`Задавайте открытые вопросы и не бойтесь пауз.`],
x:`«Если я правильно понял, вас беспокоит не цена, а сроки поставки. Расскажите подробнее, что для вас критично?»`,
p:`В ближайшем разговоре пять раз перефразируйте сказанное собеседником и задайте два открытых вопроса.`,
q:[[`Что такое перефразирование?`,[`повтор своими словами услышанного для проверки`,`спор`,`игнорирование`,`критика`],0,`Вы проверяете, правильно ли поняли собеседника.`],
[`Какой вопрос открытый?`,[`Вы согласны?`,`Расскажите подробнее, что вас беспокоит`,`Да или нет?`,`Сколько?`],1,`Открытый вопрос не имеет ответа «да» или «нет».`],
[`Зачем нужна пауза?`,[`Дать собеседнику раскрыться`,`Закончить разговор`,`Отдохнуть`,`Выиграть время`],0,`После паузы люди часто добавляют самое важное.`]]},
{t:`Якорение и уступки`,m:14,
b:[`Якорь это первая названная цифра: она задаёт диапазон обсуждения. Если у вас хорошая информация, называйте первую цифру смело и обоснованно. Если нет, дайте высказаться другой стороне.`,`Уступки делайте постепенно и меняйте на ответные («Если вы…, то я…»); уменьшайте размер каждой следующей уступки: это сигнал, что вы приближаетесь к пределу. Не уступайте даром.`],
k:[`Первая цифра задаёт рамку разговора.`,`Уступка в обмен на уступку.`,`Уменьшающиеся уступки сигнализируют предел.`],
x:`«Мы можем уменьшить срок поставки на два дня, если вы подтвердите заказ сегодня».`,
p:`Подготовьте для своих переговоров три уступки, которые вы готовы дать, и что попросите взамен.`,
q:[[`Что такое якорь?`,[`первая цифра, задающая диапазон`,`корабельный якорь`,`последняя уступка`,`финальный договор`],0,`Первая названная цифра смещает всё обсуждение к себе.`],
[`Как правильно уступать?`,[`Всё сразу`,`Постепенно и в обмен на ответную уступку`,`Бесплатно`,`Никогда`],1,`Уступки без ответных шагов обесценивают вашу позицию.`],
[`Что сигнализируют уменьшающиеся уступки?`,[`что вы приближаетесь к пределу`,`что вы слабы`,`что вы сдаётесь`,`ничего`],0,`Каждая следующая уступка меньше: собеседник понимает, что запас заканчивается.`]]},
{t:`Сложные разговоры`,m:14,
b:[`Сложные разговоры (отказ, критика, конфликт) проще вести по схеме: факты без оценок, ваше состояние («я чувствую…»), вопрос о версии собеседника, совместный поиск решения. Говорите «я-сообщениями»: «Я переживаю, когда срок срывается» вместо «Ты вечно срываешь».`,`Сохраняйте любопытство: у каждого своё видение событий. Договоритесь о следующем шаге.`],
k:[`Факты без оценок, затем ваше состояние.`,`Я-сообщения вместо обвинений.`,`Закончите разговор договорённостью о шаге.`],
x:`«Отчёт пришёл в пятницу вместо среды (факт). Я переживаю, потому что клиент ждал (я-сообщение). Что произошло с вашей стороны? (вопрос)»`,
p:`Подготовьте сложный разговор: напишите факты, я-сообщение, вопрос и предложение следующего шага.`,
q:[[`Что такое «я-сообщение»?`,[`говорить о своих чувствах и фактах, а не обвинять`,`говорить только о себе`,`молчать`,`приказывать`],0,`Я-сообщение описывает ваше состояние и не обвиняет человека.`],
[`С чего начать сложный разговор?`,[`С фактов без оценок`,`С обвинения`,`С ультиматума`,`С шутки над человеком`],0,`Факты снижают защитную реакцию и дают общую основу.`],
[`Чем лучше закончить такой разговор?`,[`Спором`,`Договорённостью о следующем шаге`,`Тишиной`,`Обидой`],1,`Конкретный шаг превращает разговор в результат.`]]}
]},
{id:'wr',tag:'Письмо',title:'Грамотное письмо',color:'#65A30D',lvl:'Деловой русский',
desc:`Короткий практический курс о том, как писать ясно, грамотно и убедительно: рабочие письма, сообщения и отчёты. Наставник проверяет ваши итоги по урокам и показывает ошибки.`,
goal:[`Писать коротко и по делу: одна мысль в одном предложении`,`Выстраивать письмо от главного к деталям`,`Избегать частых ошибок и сохранять деловой тон`],
l:[
{t:`Одна мысль, одно предложение`,m:10,
b:[`Длинное предложение с несколькими мыслями трудно читать: читателю приходится держать в голове всё сразу. Хорошее правило: одно предложение несёт одну мысль, а в среднем в нём 12–20 слов. Если предложение не помещается в две строки, его стоит разделить.`,`Уберите канцелярит и пустые слова: вместо «осуществить проверку» пишите «проверить», вместо «в целях обеспечения» пишите «чтобы», вместо «в настоящее время» пишите «сейчас». Короткое слово почти всегда сильнее длинного.`],
k:[`Одно предложение: одна мысль, обычно до 20 слов.`,`Глагол вместо отглагольного существительного: «проверить», а не «осуществить проверку».`,`Главное ставьте в начало: вывод или просьбу, потом детали.`],
x:`Было: «В целях обеспечения своевременного выполнения работ необходимо осуществить согласование сроков.» Стало: «Чтобы успеть вовремя, давайте согласуем сроки.»`,
p:`Возьмите своё последнее рабочее сообщение из трёх-четырёх предложений и сократите его на треть, сохранив смысл.`,

b:[`Несколько ошибок встречаются особенно часто. Глагола «ложить» не существует: говорят «класть» и «положить». Слово «оплатить» не требует предлога («оплатить счёт»), а «заплатить» требует «за» («заплатить за проезд»). Правильно «скучать по другу», а не «скучать за другом».`,`Для написания «-тся» и «-ться» задайте вопрос. Что делает? Старается («-тся»). Что делать? Стараться («-ться»). И не забывайте запятую перед «что», «чтобы», «который», «потому что», когда они начинают новую часть предложения.`],

/* ===================== Саморазвитие: данные, прогресс, ДНК ===================== */
const devCourse=id=>COURSES.find(c=>c.id===id);
const devP=cid=>S.dev.prog[cid]||(S.dev.prog[cid]={done:{},wrong:{},pract:{}});
const DEVTIPS=[`Повторение через интервалы (завтра, через три дня, через неделю) запоминается лучше, чем один длинный подход.`,`Учитесь по 15–20 минут каждый день: это эффективнее, чем два часа раз в неделю.`,`Проверяйте себя вместо перечитывания: вспоминание самый сильный способ закрепить знание.`,`Применяйте в тот же день: одно новое правило в рабочем письме или разговоре.`,`Объясните тему вслух, как будто рассказываете коллеге: пробелы в понимании сразу видны.`,`Берегите сон: именно во сне память закрепляет выученное.`,`Выберите один навык на месяц, остальные ведите в фоне: фокус быстрее даёт видимый рост.`];
const fmtMin=m=>m>=60?`${Math.floor(m/60)} ч${m%60?` ${m%60} мин`:''}`:`${m} мин`;
function devStat(c){
  const P=devP(c.id),n=c.l.length,idx=Object.keys(P.done).map(Number),nd=idx.length;
  const mins=c.l.reduce((s,l,i)=>s+(P.done[i]?l.m:0),0),left=c.l.reduce((s,l,i)=>s+(P.done[i]?0:l.m),0);
  const sc=idx.filter(i=>P.done[i].sc!=null);
  const mastery=sc.length?Math.round(sc.reduce((s,i)=>s+P.done[i].sc/P.done[i].tot,0)/sc.length*100):null;
  const next=c.l.findIndex((l,i)=>!P.done[i]);
  const recent=idx.filter(i=>P.done[i].d>=addDays(TODAY(),-13)).length,pace=Math.max(recent/2,1);
  const eta=nd>=n?'':addDays(TODAY(),Math.ceil((n-nd)/pace)*7);
  const last=idx.reduce((m,i)=>P.done[i].d>m?P.done[i].d:m,'');
  const weak=c.l.map((l,i)=>({i,w:l.q.filter((_,qi)=>P.wrong[c.id+'-'+i+'-'+qi]).length})).filter(x=>x.w>0);
  return {n,nd,pct:Math.round(nd/n*100),mins,left,mastery,next,eta,last,weak,pace};
}
function devStreak(){let d=S.dev.days[TODAY()]?TODAY():addDays(TODAY(),-1),n=0;while(S.dev.days[d]){n++;d=addDays(d,-1);}return n;}
function devWeekDone(){const m=mondayOfY(TODAY());let n=0;COURSES.forEach(c=>{Object.values(devP(c.id).done).forEach(x=>{if(x.d>=m)n++;});});return n;}
function devDone(cid,i,sc,tot){const P=devP(cid),was=P.done[i];
  P.done[i]={d:was?was.d:TODAY(),sc:sc==null?(was?was.sc:null):Math.max(sc,was&&was.sc!=null?was.sc:0),tot:tot||(was&&was.tot)||3};
  S.dev.days[TODAY()]=true;}
function devWrongN(){return Object.values(S.dev.prog).reduce((s,P)=>s+Object.keys(P.wrong).length,0);}
function devAdvice(){
  const stats=COURSES.map(c=>({c,s:devStat(c)})),wrongN=devWrongN(),td=TODAY();
  const open=stats.filter(x=>x.s.nd<x.s.n),active=open.filter(x=>x.s.nd>0);
  let today;
  const idle=active.filter(x=>diffDays(x.s.last,td)>=3).sort((a,b)=>a.s.last<b.s.last?-1:1)[0];
  if(wrongN>=3)today={tt:'Повторите трудные вопросы',tx:`Есть ${wrongN} ${pl(wrongN,['вопрос','вопроса','вопросов'])}, на которые вы отвечали неверно. Пять минут повторения сегодня закрепят их надолго.`,act:'dev-review',al:'Повторить'};
  else if(idle)today={tt:`Вернитесь к курсу «${idle.c.tag}»`,tx:`Вы не занимались им ${diffDays(idle.s.last,td)} ${pl(diffDays(idle.s.last,td),['день','дня','дней'])}. Достаточно одного урока на ${idle.c.l[idle.s.next].m} минут, чтобы не терять темп.`,act:'dev-open-next',al:'К уроку',id:idle.c.id};
  else if(active.length){const b=active.sort((a,b)=>b.s.pct-a.s.pct)[0];today={tt:`Продолжайте «${b.c.tag}»`,tx:`Вы прошли ${b.s.nd} из ${b.s.n} уроков. Следующий: «${b.c.l[b.s.next].t}» (${b.c.l[b.s.next].m} мин). Лучше довести начатое, чем открывать новое.`,act:'dev-open-next',al:'К уроку',id:b.c.id};}
  else if(open.length){const c=open[0].c;today={tt:`Начните курс «${c.tag}»`,tx:`Первый урок займёт ${c.l[0].m} минут. Начните с малого: регулярность важнее длительности.`,act:'dev-open-next',al:'Начать',id:c.id};}
  else today={tt:'Все курсы пройдены',tx:'Отличная работа! Пройдите итоговые тесты, чтобы закрепить знания, и выберите новую цель.',act:'dev-review',al:'Повторить'};
  const wk=devWeekDone(),goal=S.dev.goal;
  const week=wk>=goal?`Цель недели выполнена: ${wk} из ${goal} ${pl(goal,['урока','уроков','уроков'])}. Можно добавить ещё один урок или закрепить тестом.`:`На этой неделе ${wk} из ${goal}. Осталось ${goal-wk} ${pl(goal-wk,['урок','урока','уроков'])}: распределите их по дням, например по 15 минут.`;
  const sc=stats.filter(x=>x.s.mastery!=null).sort((a,b)=>b.s.mastery-a.s.mastery);
  const focus=sc.length?(sc.length>1&&sc[sc.length-1].s.mastery<75?`Сильнее всего даётся «${sc[0].c.tag}» (освоение ${sc[0].s.mastery}%). Подтянуть стоит «${sc[sc.length-1].c.tag}» (${sc[sc.length-1].s.mastery}%): перечитайте ключевое и пройдите тесты заново.`:`Освоение хорошее: «${sc[0].c.tag}» ${sc[0].s.mastery}%. Держите темп и применяйте знания в работе.`):'Пройдите первый тест, и я подскажу, какие темы стоит подтянуть.';
  const doy=Math.floor((parseYmd(td)-new Date(parseYmd(td).getFullYear(),0,0))/864e5);
  return {today,week,wk,goal,focus,tip:DEVTIPS[doy%DEVTIPS.length]};
}

/* ---------- ДНК: двойная спираль, все курсы на одной линии ---------- */
const DNA={cv:null,x:null,raf:0,t0:0,t:0,W:0,H:0,dpr:1,focus:'',hover:'',hoverL:'',cam:0,tcam:0,steps:null,drag:null,L:null,data:null,reduced:false,parts:null,hi:{},hl:{}};
const DNA_GAP=64,DNA_PAD=56,DNA_PITCH=210,DNA_RS=12;
const DNA_DOTS=8;
const dnaPhase=wx=>wx*Math.PI*2/DNA_PITCH+0.7; /* фаза зависит только от места: спираль неподвижна, курсы и уроки — её части */
function dnaCalc(steps){
  const segs=[],rungs=[];let x=DNA_PAD;
  COURSES.forEach((c,ci)=>{const st=steps[c.id],seg={id:c.id,ci,color:c.color,x0:x,x1:x,spans:[],rungs:[]};
    x+=DNA_GAP/2;
    for(let i=0;i<c.l.length;i++){seg.rungs.push(x+st/2);seg.spans.push([x,x+st]);rungs.push({x:x+st/2,ci,i,cid:c.id,a:x,b:x+st});x+=st;}
    x+=DNA_GAP/2;seg.x1=x;segs.push(seg);});
  return {segs,rungs,total:x+DNA_PAD};
}
function dnaTargets(W,focus){
  const n=COURSES.reduce((s,c)=>s+c.l.length,0),fit=Math.max(18,Math.min(40,(W-2*DNA_PAD-DNA_GAP*COURSES.length)/n)),t={};
  COURSES.forEach(c=>{t[c.id]=focus?(c.id===focus?100:20):fit;});return t;
}
function dnaCamTarget(L,W,focus){
  if(focus){const s=L.segs.find(x=>x.id===focus);if(s){const mid=(s.x0+s.x1)/2-W/2;return Math.max(0,Math.min(Math.max(0,L.total-W),mid));}}
  return L.total<=W?-(W-L.total)/2:0;
}
function dnaHit(sx){const L=DNA.L;if(!L)return null;const wx=sx+DNA.cam,s=L.segs.find(z=>wx>=z.x0&&wx<z.x1);if(!s)return null;
  const i=s.spans.findIndex(sp=>wx>=sp[0]&&wx<sp[1]);return {seg:s.id,lesson:i>=0?i:null,rung:DNA.focus===s.id&&i>=0?i:null};}
function dnaClick(sx){const h=dnaHit(sx);
  if(!h){if(DNA.focus)location.hash='dev';return;}
  if(h.rung!=null){location.hash=`lesson-${h.seg}-${h.rung}`;return;}
  location.hash=DNA.focus===h.seg?'dev':'dev-'+h.seg;}
function dnaResize(){const cv=DNA.cv;if(!cv)return;DNA.dpr=Math.min(2,window.devicePixelRatio||1);const r=cv.getBoundingClientRect();DNA.W=Math.round(r.width)||cv.clientWidth||0;DNA.H=Math.round(r.height)||cv.clientHeight||300;
  cv.width=Math.max(1,Math.round(DNA.W*DNA.dpr));cv.height=Math.max(1,Math.round(DNA.H*DNA.dpr));}
function dnaStop(){if(DNA.raf)cancelAnimationFrame(DNA.raf);DNA.raf=0;DNA.cv=null;}
function dnaSync(){const cv=document.getElementById('dna');if(!cv){dnaStop();return;}dnaStart(cv);}
function dnaSetHover(seg,lesson){const key=seg&&lesson!=null?seg+':'+lesson:'';
  if(DNA.hover===seg&&DNA.hoverL===key)return;DNA.hover=seg;DNA.hoverL=key;
  document.querySelectorAll('.dchip').forEach(ch=>ch.classList.toggle('hv',!!seg&&ch.dataset.id===seg));
  if(DNA.reduced&&DNA.cv){dnaStep(1);dnaDraw();}}
function dnaStart(cv){
  if(DNA.raf)cancelAnimationFrame(DNA.raf);DNA.raf=0;
  const ctx=cv.getContext&&cv.getContext('2d');if(!ctx)return;
  DNA.cv=cv;DNA.x=ctx;const m=/^dev-([a-z]+)$/.exec(location.hash.slice(1));DNA.focus=m&&devCourse(m[1])?m[1]:'';DNA.hover='';DNA.hoverL='';
  DNA.reduced=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  DNA.data=COURSES.map(c=>{const P=devP(c.id),s=devStat(c);return {pct:s.nd/s.n,done:c.l.map((l,i)=>P.done[i]||null),next:s.next};});
  if(!DNA.parts)DNA.parts=Array.from({length:40},(_,i)=>({x:(i*97)%100/100,y:(i*53)%100/100,r:0.5+(i%3)*0.5,v:0.004+(i%5)*0.002}));
  dnaResize();
  if(!DNA.steps)DNA.steps=dnaTargets(DNA.W||800,DNA.focus);

function qItem(cid,li,qi){const q=devCourse(cid).l[li].q[qi],idx=shuf([0,1,2,3]);return {id:`${cid}-${li}-${qi}`,cid,li,q:q[0],o:idx.map(k=>q[1][k]),a:idx.indexOf(q[2]),e:q[3]};}
function quizStart(mode,cid,li,qs){S.qz={mode,cid,li,qs,i:0,pick:null,ans:[],fin:false};location.hash='quiz';render();}
function quizLesson(cid,li){quizStart('lesson',cid,li,shuf(devCourse(cid).l[li].q.map((_,qi)=>qItem(cid,li,qi))));}
function quizPool(cid,onlyDone){const c=devCourse(cid),P=devP(cid),pool=[];c.l.forEach((l,li)=>{if(!onlyDone||P.done[li])l.q.forEach((_,qi)=>pool.push([li,qi]));});return pool;}
function quizCourse(cid){let pool=quizPool(cid,true);if(pool.length<4)pool=quizPool(cid,false);quizStart('course',cid,-1,shuf(pool).slice(0,10).map(([li,qi])=>qItem(cid,li,qi)));}
function quizReview(){
  const has=(p,x)=>p.some(z=>z[0]===x[0]&&z[1]===x[1]&&z[2]===x[2]);let pool=[];
  COURSES.forEach(c=>Object.keys(devP(c.id).wrong).forEach(k=>{const [,li,qi]=k.split('-');pool.push([c.id,+li,+qi]);}));pool=shuf(pool).slice(0,8);
  const fill=only=>{const all=[];COURSES.forEach(c=>quizPool(c.id,only).forEach(([li,qi])=>all.push([c.id,li,qi])));shuf(all).forEach(x=>{if(pool.length<5&&!has(pool,x))pool.push(x);});};
  if(pool.length<5)fill(true);if(pool.length<5)fill(false);
  quizStart('review','',-1,shuf(pool).map(([cid,li,qi])=>qItem(cid,li,qi)));
}
function quizPick(n){const Q=S.qz;if(!Q||Q.fin||Q.pick!=null)return;const q=Q.qs[Q.i],ok=n===q.a;Q.pick=n;Q.ans[Q.i]=ok;sfx(ok?'right':'wrong');
  if(q.id&&q.cid){const P=devP(q.cid);if(ok){delete P.wrong[q.id];}else P.wrong[q.id]=(P.wrong[q.id]||0)+1;}render();}
function quizNext(){const Q=S.qz;if(!Q||Q.pick==null)return;
  if(Q.i<Q.qs.length-1){Q.i++;Q.pick=null;sfx('soft');render();return;}
  Q.fin=true;S.dev.days[TODAY()]=true;const ok=Q.ans.filter(Boolean).length,n=Q.qs.length;
  if(Q.mode==='lesson'&&ok/n>=2/3){const was=!!devP(Q.cid).done[Q.li];devDone(Q.cid,Q.li,ok,n);toast(was?'Результат теста обновлён.':'Урок засчитан. ДНК стала ярче.');if(was)sfx('done');else fxShatter();}else sfx('soft');
  render();}
function quizRetry(){const Q=S.qz;if(!Q)return;if(Q.mode==='lesson')quizLesson(Q.cid,Q.li);else if(Q.mode==='course')quizCourse(Q.cid);else if(Q.mode==='gen')quizGenerate(Q.cid,Q.li);else quizReview();}

function botReply(q){
  if(q==='today'){
    const list=todayData().filter(x=>!isDone(x)),hb=S.habits.filter(h=>!h.days[6]);
    if(!list.length&&!hb.length)return 'На сегодня всё выполнено.';
    return (list.length?'Сегодня наступил срок по задачам:<ul>'+list.map(x=>`<li><b>${esc(x.title)}</b>: ${x.due<TODAY()?dueLabel(x.due):'срок сегодня'}, приоритет ${x.prio.toLowerCase()}</li>`).join('')+'</ul>':'Задач со сроком на сегодня нет.')
      +(hb.length?`<br>Ежедневные дела, которые ещё не отмечены: ${hb.map(h=>esc(h.name)+(h.time?' ('+h.time+')':'')).join(', ')}.`:'');
  }
  if(q==='inbox'){
    if(!S.inbox.length)return 'Входящие пусты. Разбирать нечего.';
    return 'Вот как я бы разобрал входящие:<ul>'+S.inbox.map(i=>`<li>«${esc(i.text)}»: ${/идея|придумать|курс|магазин/i.test(i.text)?'в идеи':'в задачи, не забудь указать срок'}</li>`).join('')+'</ul>Разбери их на экране «Входящие».';
  }
  if(q==='forgot'){
    const li=[],td=TODAY();
    open().filter(x=>x.due&&x.due<td).forEach(x=>li.push(`Просрочено: «${esc(x.title)}», ответственный ${esc(whoText(x))}`));
    S.tasks.filter(x=>x.status==='На проверке').forEach(x=>li.push(`Ждёт проверки: «${esc(x.title)}»`));
    open().filter(x=>(x.moves||0)>=2).forEach(x=>li.push(`Переносилась ${x.moves} ${pl(x.moves,['раз','раза','раз'])}: «${esc(x.title)}». Возможно, её стоит разбить на части`));
    open().filter(x=>!x.due).forEach(x=>li.push(`Нет срока, поэтому не попадёт в «Сегодня»: «${esc(x.title)}»`));
    if(S.inbox.length)li.push(`Во входящих ${S.inbox.length} ${pl(S.inbox.length,['неразобранная запись','неразобранные записи','неразобранных записей'])}`);
    return li.length?'Вот что я бы проверил:<ul>'+li.map(x=>`<li>${x}</li>`).join('')+'</ul>':'Ничего не потеряно. Всё под контролем.';
  }
  return CLOUD?'Сейчас я отвечаю только на быстрые команды: нажмите одну из кнопок над полем ввода.':'Это макет, поэтому я отвечаю только на быстрые команды. В готовом приложении здесь ответит Claude: он увидит твои задачи, сроки и ежедневные дела.';
}

/* ---------- Напоминания о намазе: уведомления в браузере и календарный файл для телефона ---------- */
const PN={on:false,before:0,timer:0,sent:{}};
(()=>{try{const o=JSON.parse(localStorage.getItem('nq-pnotify')||'null');if(o){PN.on=!!o.on;PN.before=[0,5,10,15].includes(o.before)?o.before:0;}PN.sent=JSON.parse(localStorage.getItem('nq-pnotify-sent')||'{}')||{};}catch(e){PN.sent={};}})();
const pnSave=()=>{try{localStorage.setItem('nq-pnotify',JSON.stringify({on:PN.on,before:PN.before}));localStorage.setItem('nq-pnotify-sent',JSON.stringify(PN.sent));}catch(e){}};
const pnSupported=()=>typeof Notification!=='undefined';
const pnPerm=()=>pnSupported()?Notification.permission:'unsupported';
const pnOn=()=>PN.on&&pnPerm()==='granted';
const p2=n=>String(n).padStart(2,'0');
/* местные часы (UTC+5), чтобы напоминание совпадало со временем намаза, где бы ни было устройство */
function pnNow(){const d=new Date(Date.now()+(300+new Date().getTimezoneOffset())*60000);return {day:`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`,min:d.getHours()*60+d.getMinutes()+d.getSeconds()/60};}
async function pnShow(title,body,tag){
  const opts={body,tag,icon:'icon-192.png',badge:'icon-192.png'};
  try{const reg=navigator.serviceWorker&&navigator.serviceWorker.getRegistration?await navigator.serviceWorker.getRegistration():null;
    if(reg&&reg.showNotification)await reg.showNotification(title,opts);else new Notification(title,opts);}catch(e){try{new Notification(title,opts);}catch(x){}}
  if(typeof FXP!=='undefined'&&FXP.sound)sfx('done');
}
function pnTick(now){
  if(!pnOn()||!S.pray||!S.pray.on)return;const n=now||pnNow(),T=prayerFinal(n.day,S.pray.city,S.pray.adj);let changed=false;
  PRAYERS.forEach(p=>{const tm=Math.round(T[p.k]),at=tm-PN.before,key=n.day+'|'+p.k+'|'+PN.before;
    if(n.min>=at&&n.min<at+8&&!PN.sent[key]){PN.sent[key]=1;changed=true;
      pnShow(PN.before?`Через ${PN.before} мин: ${p.n}`:`Время намаза: ${p.n}`,PN.before?`Намаз в ${prFmt(tm)}`:`Сейчас ${prFmt(tm)}`,'nq-pray-'+p.k);}});
  const old=Object.keys(PN.sent).filter(k=>k.slice(0,10)<n.day);if(old.length){old.forEach(k=>delete PN.sent[k]);changed=true;}
  if(changed)pnSave();
}
function pnStart(){clearInterval(PN.timer);PN.timer=setInterval(()=>pnTick(),20000);}
async function pnRegister(){try{if('serviceWorker' in navigator)await navigator.serviceWorker.register('sw.js');}catch(e){}}
async function pnToggle(){
  if(!pnSupported()){toast('Этот браузер не поддерживает уведомления. Используйте календарь для телефона.');return;}
  if(PN.on){PN.on=false;pnSave();render();return;}
  let perm=Notification.permission;if(perm==='default'){try{perm=await Notification.requestPermission();}catch(e){perm='default';}}
  if(perm!=='granted'){toast(perm==='denied'?'Уведомления запрещены в браузере. Разрешите их для этого сайта в настройках браузера.':'Разрешение на уведомления не получено.');render();return;}
  PN.on=true;pnSave();pnRegister();pnStart();toast('Напоминания о намазе включены.');render();pnTick();
}
if(PN.on)pnStart();
/* календарный файл (.ics): пять событий в день со звуковым напоминанием; одинаковые UID не дают дубликатов при повторной загрузке */
const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
const icsUtc=ms=>{const d=new Date(ms);return `${d.getUTCFullYear()}${p2(d.getUTCMonth()+1)}${p2(d.getUTCDate())}T${p2(d.getUTCHours())}${p2(d.getUTCMinutes())}00Z`;};
function icsFold(line){const out=[];let cur='',len=0,lim=73;for(const ch of line){const b=unescape(encodeURIComponent(ch)).length;if(len+b>lim){out.push(cur);cur=' ';len=1;lim=73;}cur+=ch;len+=b;}out.push(cur);return out.join('\r\n');}
function prayIcs(days,before,from,stamp){
  const c=prayCity(S.pray.city),L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//NQ//Namaz//RU','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc('Намаз (NQ)'),'X-WR-TIMEZONE:Asia/Dushanbe'],st=icsUtc(stamp||Date.now());
  for(let i=0;i<days;i++){const day=addDays(from||TODAY(),i),T=prayerFinal(day,S.pray.city,S.pray.adj),[y,m,d]=day.split('-').map(Number);
    PRAYERS.forEach(p=>{const tm=Math.round(T[p.k]);if(!Number.isFinite(tm))return;const ms=Date.UTC(y,m-1,d)+(tm-PRAY_ZONE*60)*60000;
      L.push('BEGIN:VEVENT','UID:nq-pray-'+day+'-'+p.k+'@nq','DTSTAMP:'+st,'DTSTART:'+icsUtc(ms),'DTEND:'+icsUtc(ms+15*60000),'SUMMARY:'+icsEsc('Намаз: '+p.n),'DESCRIPTION:'+icsEsc('Время намаза в '+prFmt(tm)+', '+c.n),'CATEGORIES:'+icsEsc('Намаз'),'TRANSP:TRANSPARENT',
        'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Намаз: '+p.n),(before?'TRIGGER:-PT'+before+'M':'TRIGGER:PT0S'),'END:VALARM','END:VEVENT');});}
  L.push('END:VCALENDAR');return L.map(icsFold).join('\r\n')+'\r\n';
}
function pnDownloadIcs(){
  const days=Math.max(1,Math.min(120,Math.round(Number(($('#pn-days')||{}).value)||60))),txt=prayIcs(days,PN.before);
  const a=document.createElement('a'),u=URL.createObjectURL(new Blob([txt],{type:'text/calendar;charset=utf-8'}));a.href=u;a.download=`namaz-nq-${TODAY()}.ics`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
  toast(`Календарь на ${days} ${pl(days,['день','дня','дней'])} скачан. Откройте файл на телефоне.`);
}
function pnHtml(sw,row){
  const per=pnPerm(),d=per==='unsupported'?'Этот браузер не поддерживает уведомления. Используйте календарь для телефона ниже':per==='denied'?'Уведомления запрещены для этого сайта. Разрешите их в настройках браузера (значок замка рядом с адресом)':'Напоминание в момент намаза, пока сайт открыт во вкладке или установлен как приложение. На iPhone работает только из значка на экране «Домой», для надёжности используйте календарь ниже';

    ${row('Когда напомнить','Для уведомлений и для календарного файла',`<select class="sel" data-change="pn-before" aria-label="За сколько минут напомнить">${[0,5,10,15].map(m=>`<option value="${m}"${PN.before===m?' selected':''}>${m?'за '+m+' мин':'в момент намаза'}</option>`).join('')}</select><button class="btn small" type="button" data-act="pn-test">Проверить</button>`)}
    <div class="srow prcal"><div class="sl"><b>Календарь для телефона</b><span class="muted small">Файл с намазами на ближайшие дни и звуковым напоминанием: откройте его на телефоне, и события добавятся в календарь. Когда дни закончатся, скачайте новый файл: события обновятся без дубликатов</span>
      <details class="prhelp"><summary>Как добавить в календарь</summary><ul><li><b>iPhone:</b> откройте скачанный файл (в Safari или в «Файлах») и нажмите «Добавить все».</li><li><b>Android:</b> откройте файл и выберите Google Календарь. Если не получилось, на компьютере: calendar.google.com, Настройки, Импорт.</li><li>Чтобы напоминание звучало, в настройках этого календаря включите уведомление «в момент события».</li></ul></details></div>
      <div class="sc prform"><label class="pra"><span>На сколько дней</span><select class="sel" id="pn-days" aria-label="На сколько дней скачать календарь"><option value="30">30</option><option value="60" selected>60</option><option value="90">90</option></select></label><button class="btn" type="button" data-act="pn-ics">Скачать календарь</button></div></div>`;
}
/* ---------- Claude: встроенный (внутри Claude) или защищённая функция Supabase (на сайте) ---------- */
const AIM={on:true};try{AIM.on=localStorage.getItem('nq-aim')!=='0';}catch(e){}
function aimSave(){try{localStorage.setItem('nq-aim',AIM.on?'1':'0');}catch(e){}}
const AI_AVAIL=()=>!!window.claude||!!(CLOUD&&typeof CL!=='undefined'&&CL.user&&!(window.NQ_CONFIG&&NQ_CONFIG.ai===false));
const AI_ON=()=>AIM.on&&AI_AVAIL();
async function aiCloud(o){
  if(o.signal&&o.signal.aborted)throw {code:'cancelled'};
  let ses=null;try{ses=(await CL.sb.auth.getSession()).data.session;}catch(e){}
  if(!ses)throw {code:'auth'};
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),NQ_CONFIG.aiTimeoutMs||70000),onAb=()=>ctl.abort();
  if(o.signal)o.signal.addEventListener('abort',onAb);
  let r,j={};
  try{r=await fetch(NQ_CONFIG.url+'/functions/v1/claude',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+ses.access_token,'apikey':NQ_CONFIG.key},body:JSON.stringify({kind:o.kind||'long',system:o.system||'',messages:o.messages}),signal:ctl.signal});j=await r.json().catch(()=>({}));}
  catch(e){if(o.signal&&o.signal.aborted)throw {code:'cancelled'};throw {code:'network'};}
  finally{clearTimeout(to);if(o.signal)o.signal.removeEventListener('abort',onAb);}
  if(!r.ok){throw {code:r.status===429?'quota':(r.status===401||r.status===403)?'auth':r.status===404?'absent':'upstream',message:j&&j.error};}
  const text=String(j.text||'').trim();if(!text)throw {code:'empty_completion'};
  if(o.onText){try{o.onText({text});}catch(e){}}
  return {text};
}
const aiJson=txt=>{const s=String(txt||'').replace(/```[a-z]*\n?|```/gi,'').trim(),a=s.search(/[\[{]/),b=Math.max(s.lastIndexOf(']'),s.lastIndexOf('}'));if(a<0||b<a)throw {code:'bad_json'};try{return JSON.parse(s.slice(a,b+1));}catch(e){throw {code:'bad_json'};}};
async function aiChat(messages,system,signal){
  const c=window.claude;
  if(c&&typeof c.use==='function'){const sm=await c.use('sample');if(!sm)throw {code:'absent'};
    return sm(system+'\n\nДиалог:\n'+messages.map(m=>(m.role==='user'?'Пользователь: ':'Ассистент: ')+m.content).join('\n')+'\nАссистент:',{signal,cache:false});}
  return aiCloud({messages,system,kind:'long',signal});
}
const CHAT={busy:false};
const chatText=html=>{try{return new DOMParser().parseFromString(String(html||''),'text/html').body.textContent||'';}catch(e){return '';}};
function chatContext(){
  const td=TODAY(),wd=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'][new Date().getDay()],cl=s=>String(s||'').replace(/\s+/g,' ').slice(0,120);
  const op=S.tasks.filter(x=>!CLOSED.includes(x.status)),late=op.filter(x=>x.due&&x.due<td);
  const fmt=x=>`- «${cl(x.title)}»: срок ${x.due||'нет'}, приоритет ${x.prio.toLowerCase()}, статус ${x.status.toLowerCase()}, ответственные ${whoText(x)}${x.project&&proj(x.project)?', проект «'+cl(proj(x.project).name)+'»':''}`;
  const soon=op.filter(x=>x.due&&x.due<=addDays(td,7)).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0).slice(0,25);
  const nodue=op.filter(x=>!x.due&&x.repeat!=='daily').slice(0,10);
  const L=['Ты помощник в личном планировщике NQ. Отвечай по-русски, коротко и по делу (обычно до 120 слов), простым языком, без markdown-разметки и заголовков; списки пиши строками, начинающимися с тире. Опирайся только на данные ниже. Если данных не хватает, так и скажи и предложи, что добавить. Ничего не выдумывай. Ты не меняешь данные, ты только советуешь.',
    `Сегодня ${td}, ${wd}.`,`Открытых задач: ${op.length}. Просрочено: ${late.length}.`];
  L.push(soon.length?'Задачи с ближайшим сроком (до 7 дней вперёд) и просроченные:\n'+soon.map(fmt).join('\n'):'Задач с ближайшим сроком нет.');
  if(nodue.length)L.push('Задачи без срока:\n'+nodue.map(fmt).join('\n'));
  L.push(S.inbox.length?`Входящие, неразобранные (${S.inbox.length}, последние 10):\n`+S.inbox.slice(0,10).map(i=>'- '+cl(i.text)).join('\n'):'Входящие пусты.');
  if(S.ideas.length)L.push(`Идеи (${S.ideas.length}, последние 10):\n`+S.ideas.slice(0,10).map(d=>`- ${cl(d.text)} (${d.status})`).join('\n'));
  if(S.habits.length)L.push('Ежедневные дела:\n'+S.habits.map(h=>`- ${cl(h.name)}${h.time?' ('+h.time+')':''}: сегодня ${h.days[6]?'отмечено':'не отмечено'}`).join('\n'));
  L.push('Саморазвитие:\n'+devContext());
  return L.join('\n').slice(0,9000);
}
async function chatAsk(v){
  if(CHAT.busy)return;CHAT.busy=true;
  const wait={who:'bot',html:'<span class="muted"><i class="spin"></i> Думаю…</span>',wait:true};
  S.chat.push({who:'me',html:esc(v),text:v},wait);S.focusChat=true;render();
  const msgs=S.chat.filter(m=>!m.wait).slice(-11).map(m=>({role:m.who==='me'?'user':'assistant',content:String(m.text||chatText(m.html)).slice(0,4000)})).filter(m=>m.content.trim());
  let reply='',err=null;
  try{const r=await aiChat(msgs,chatContext());reply=advClean(r&&r.text);if(!reply)throw {code:'empty_completion'};}catch(e){err=e||{};}

  if(i>=0){
    if(!err)S.chat[i]={who:'bot',html:esc(reply).replace(/\n/g,'<br>'),text:reply};
    else{const why=devWhy(err).replace('Наставник на Claude недоступен в этом режиме.','Claude сейчас недоступен.');S.chat[i]={who:'bot',html:esc(why)+'<br><br>'+botReply(''),text:why};}
  }

}
